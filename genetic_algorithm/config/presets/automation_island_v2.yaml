# automation_island_v2 — guarded search-only baseline for unattended evolution.
#
# This profile intentionally enables only Generic Island plus full pair-split
# validation. It does not trade, deploy, consume FINAL_TEST data, or authorize
# a candidate for production. WF, holdout, SIS, LLM, surrogate, MC, DSR,
# regime and mutable external-migration paths remain disabled.

preset: safe_v2

safety_profile:
  name: automation_island_v2
  enforce: true
  shadow_mode: true
  # Evolution may run unattended; strategy promotion/trading remains forbidden.
  automation_eligible: false

# Diagnostic campaign boundary. The controller will analyze this fresh root
# and stop before materializing a child wave. Raise this only after reviewing
# the persisted report produced for the root.
automation_controller:
  # Keep every diagnostic campaign distinct in the immutable wave namespace.
  # Seeds 2001 and 3001 belong to completed historical diagnoses.
  root_seeds: [4001]
  max_waves: 1

backtesting:
  pairs: [BTC/USDT, SOL/USDT, ETH/USDT, BNB/USDT]
  # Longest currently verified common gap-free interval across all four pairs.
  timerange: "20230325-20260327"
  timeframe: 1h
  max_open_trades: 3
  fee: 0.001
  slippage_pct: 0.0005
  fee_noise_std: 0.0
  auto_download_data: false
  enable_cache: true

# Independent single-pair search/replay cannot observe portfolio concurrency:
# Freqtrade allows only one open trade per pair.  Fix this neutral gene to the
# declared campaign execution limit instead of spending mutations on it.  The
# stop range remains broad, but excludes the week run's repeatedly selected
# 18-20% single-trade loss tail.
strategy_constraints:
  timeframes: [1h]
  stoploss_range: [-0.12, -0.03]
  max_open_trades_range: [3, 3]

genetic_algorithm:
  random_seed: 42
  # The worker combines this salt with the paired attempt seed only for the
  # evolutionary search RNG. Strict V2 replay keeps the paired attempt seed.
  search_seed_salt: 0
  # Graceful cap checked after every completed generation. Per-backtest
  # timeouts still bound an individual evaluation within a generation.
  max_runtime_minutes: 600
  population_size: 10
  generations: 12
  elite_size: 2
  tournament_size: 3
  random_immigrants: 1
  mode: single_objective

parallel_evaluation:
  enabled: true
  num_workers: 4

generic_island_model:
  enabled: true
  num_islands: 4
  population_per_island: 10
  generations: 12
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.35
    pair_rotation: false
    pair_subset_size: 2
  migration:
    topology: ring
    interval: 3
    count: 1
    merge_rounds: false
    merge_interval: 6
    tournament_size: 3
  walk_forward:
    enabled: false
  external_migration:
    enabled: false
    directory: ""
  islands:
    - name: momentum
      population_size: 10
      generations: 12
      seed: 42
      indicator_pool: [RSI, MACD, STOCH, CCI, MFI, ROC, WILLR]
      pairs: [BTC/USDT, SOL/USDT, ETH/USDT, BNB/USDT]
      walk_forward_enabled: false
    - name: trend
      population_size: 10
      generations: 12
      seed: 43
      indicator_pool: [EMA, SMA, TEMA, KAMA, SUPERTREND, AROON, PSAR]
      pairs: [BTC/USDT, SOL/USDT, ETH/USDT, BNB/USDT]
      walk_forward_enabled: false
    - name: volatility-volume
      population_size: 10
      generations: 12
      seed: 44
      indicator_pool: [BBANDS, ATR, DONCHIAN, OBV, CMF, VROC, VWAP]
      pairs: [BTC/USDT, SOL/USDT, ETH/USDT, BNB/USDT]
      walk_forward_enabled: false
    - name: mixed
      population_size: 10
      generations: 12
      seed: 45
      indicator_pool: [RSI, MACD, EMA, SUPERTREND, BBANDS, ATR, CMF, VWAP]
      pairs: [BTC/USDT, SOL/USDT, ETH/USDT, BNB/USDT]
      walk_forward_enabled: false

pair_validation:
  enabled: true
  # Search and strict V2 promotion must observe the same pair semantics.
  # Joint portfolios can hide a losing pair when max_open_trades is smaller
  # than the pair count, so every pair is replayed independently.
  evaluation_mode: independent_pairs
  training_pairs: [BTC/USDT, SOL/USDT]
  validation_pairs: [ETH/USDT, BNB/USDT]
  # Both two-pair groups are visible during every evaluation; neither is a
  # hidden holdout. Give the four scenarios equal survival influence.
  weight_train: 0.5
  weight_val: 0.5
  min_val_fitness: 0.0
  # Zero means every evaluated candidate receives pair validation. Deferred
  # top-N validation is intentionally forbidden in the unattended profile.
  validate_top_n_only: 0
  # Blend each split's mean evidence with its worst pair, then apply smooth
  # non-compensable penalties aligned with the strict promotion gates.
  worst_pair_weight: 0.5
  # Preserve a gradient while limiting compensation between a strong and a
  # weak pair group. This is a soft blend, not a validation gate.
  worst_split_weight: 0.25
  min_profitable_pair_ratio: 0.75
  profitable_pair_penalty_floor: 0.1
  max_pair_loss_pct: 5.0
  worst_pair_loss_penalty_floor: 0.1

# Keep the cheap search objective directionally aligned with the strict replay
# panel. The strict promotion contract measures activity per actually active
# month and pair, so the search uses the same rate instead of a campaign-length
# approximation. This remains a smooth penalty, not a hard cliff.
fitness_weights:
  profit: 0.34
  sharpe_ratio: 0.07
  sortino_ratio: 0.02
  profit_factor: 0.20
  drawdown: 0.17
  # Week-run winners often combined a very high win rate with rare, large
  # losses. Profit factor and drawdown therefore carry the quality signal;
  # win rate remains informative but cannot dominate it.
  win_rate: 0.005
  trade_frequency: 0.06
  monthly_stability: 0.005
  cross_pair: 0.02
  drawdown_duration: 0.11
  consecutive_losses: 0.00

# The old +10% clamp removed all profit selection pressure above ten percent.
# These audited bounds cover every pessimistic split summary observed in the
# week run while giving break-even little free fitness. Drawdown uses a smooth
# scale around the existing 25% promotion policy, never a pass/fail cliff.
fitness_bounds:
  profit_min: -5.0
  profit_max: 20.0
  drawdown_normalization_target: 0.25
  # PF=1 is break-even, not positive edge. Preserve a smooth gradient above
  # that point instead of gifting one third of the PF score at break-even.
  profit_factor_break_even_normalization: true

fitness_penalties:
  target_trades_per_pair: 0
  target_trades_per_active_month: 5.0
  pair_trade_penalty_floor: 0.01
  # Keep weakest-pair evidence influential without letting the activity
  # multiplier dominate profit, PF and drawdown a second time.
  pair_trade_coverage_exponent: 0.5

promotion_v2:
  enabled: true
  # v2.1 records trade activity from actual UTC close months and carries the
  # audited soft search alignment; do not pool it silently with v2.0 results.
  policy_version: automation-island-v2.1-shadow
  required_scenarios:
    - scenario_id: train-btc
      pair: BTC/USDT
      timeframe: 1h
      role: TRAIN
      period_start: "2023-03-25"
      period_end: "2026-03-26"
      cost_multiplier: 1.0
    - scenario_id: train-sol
      pair: SOL/USDT
      timeframe: 1h
      role: TRAIN
      period_start: "2023-03-25"
      period_end: "2026-03-26"
      cost_multiplier: 1.0
    - scenario_id: pair-val-bnb
      pair: BNB/USDT
      timeframe: 1h
      role: PAIR_VALIDATION
      period_start: "2023-03-25"
      period_end: "2026-03-26"
      cost_multiplier: 1.0
    - scenario_id: pair-val-eth
      pair: ETH/USDT
      timeframe: 1h
      role: PAIR_VALIDATION
      period_start: "2023-03-25"
      period_end: "2026-03-26"
      cost_multiplier: 1.0
  min_expectancy_lcb: 0.0
  min_median_annual_return_lcb: 0.0
  min_worst_scenario_return: -0.05
  max_drawdown_ucb: 0.25
  max_daily_es5_ucb: 0.05
  min_effective_sample_size: 30
  min_active_months: 12
  min_trades_per_active_month: 5.0
  min_profitable_scenario_ratio: 0.75
  max_consecutive_losses: 12
  max_drawdown_duration_days: 120
  require_final_test: false

walk_forward:
  enabled: false
holdout_validation:
  enabled: false
holdout_monitoring:
  enabled: false
monte_carlo:
  enabled: false
deflated_sharpe:
  enabled: false
surrogate:
  enabled: false
regime_aware:
  enabled: false
island_model:
  enabled: false
cpcv:
  enabled: false
sis:
  enabled: false
llm:
  enabled: false
advanced:
  llm:
    enabled: false
short_selling:
  enabled: false
multi_timeframe:
  enabled: false

output:
  # Replay a wider shortlist through the exact V2 metrics before the
  # next-wave Pareto selector chooses a parent.
  top_n: 10
