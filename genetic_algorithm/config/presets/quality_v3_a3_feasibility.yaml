fitness_penalties: {target_trades_per_active_month: 2.5, pair_trade_coverage_exponent: 0.5}
fitness_policy_v3:
  enabled: true
  policy_version: fitness-v3.0-feasibility-first
  min_trades: 12
  min_net_profit: 0.0
