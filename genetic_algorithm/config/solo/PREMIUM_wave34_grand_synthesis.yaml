      extra_config:
        genetic_algorithm:
          selection_method: 'tournament'
          tournament_size: 3
          mutation_rate: 0.18
          elite_size: 2
        strategy_constraints:
          stoploss_range: [-0.025, -0.010]
          roi_range: [0.005, 0.020]
        fitness_weights:
          profit: 0.34
          sharpe_ratio: 0.08
          sortino_ratio: 0.04
          profit_factor: 0.14
          drawdown: 0.03
          win_rate: 0.22
          trade_frequency: 0.13
          monthly_return: 0.01
          cross_pair_consistency: 0.01
        fitness_penalties:
          min_win_rate: 0.42

    # ── Group C: High-Mutation Explorers (islands 10–12) ─────────────────
    - name: island_10C_explorer
      population_size: 8
      seed: 1010
      extra_config:
        genetic_algorithm:
          selection_method: 'rank'
          mutation_rate: 0.30
          elite_size: 1
          random_immigrants: 3
          max_adaptation_factor: 3.5

    - name: island_11C_explorer
      population_size: 8
      seed: 1011
      extra_config:
        genetic_algorithm:
          selection_method: 'tournament'
          tournament_size: 2
          mutation_rate: 0.30
          elite_size: 1
          random_immigrants: 3
          max_adaptation_factor: 3.5

    - name: island_12C_explorer
      population_size: 8
      seed: 1012
      extra_config:
        genetic_algorithm:
          selection_method: 'rank'
          mutation_rate: 0.35
          elite_size: 1
          random_immigrants: 4
          max_adaptation_factor: 4.0
          crossover_rate: 0.60      # more mutation, less crossover

    # ── Group D: Momentum Indicator Specialists (islands 13–15) ──────────
    - name: island_13D_momentum
      population_size: 8
      seed: 1013
      indicator_pool:
        - 'RSI'
        - 'MACD'
