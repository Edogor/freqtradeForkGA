# ============================================================================
# WAVE34 — PREMIUM: Grand Synthesis (Solo Experiment)
# ============================================================================
# ⚠️  MANUAL LAUNCH ONLY — DO NOT PUT IN queue/
#     Run when server is completely free (no other experiments running).
#     Command: python3 -m genetic_algorithm.run_ga \
#              --config genetic_algorithm/config/solo/PREMIUM_wave34_grand_synthesis.yaml
#
# Expected RAM: ~24–40 GB (160 total individuals × 15m backtests)
# Expected CPU: 16+ cores recommended; uses parallel_islands=false (sequential
#               islands are more RAM-efficient than all-parallel)
# Expected runtime: 6–8 hours (max_runtime_minutes=420 enforces hard stop)
# ============================================================================
#
# DESIGN: 20 fully heterogeneous islands, every island is different.
# This is the grand synthesis of every insight from waves 30–34:
#
# Group A (islands 0–4): Rank Balanced — proven foundation
#   Replicates what made wave32_A so consistent (5/5 SAFE, all +profit).
#   Different seeds, slight fitness weight variations across the 5 islands.
#
# Group B (islands 5–9): Tournament W/L Champions
#   Replicates what made wave32_H (Sharpe 1.28) and wave34_B great.
#   High win_rate weights, tournament selection, min_win_rate=0.40 penalty.
#
# Group C (islands 10–12): High-Mutation Explorers
#   mutation=0.30, elite=1, immigrants=3. Maximize search breadth.
#   If they find something good, ring migration spreads it to refiners.
#
# Group D (islands 13–15): Momentum Indicator Pool
#   RSI, MACD, STOCH, ROC, MFI, WILLR — momentum signals only.
#   HI-B showed indicator specialization produces fundamentally different
#   strategy DNA. These cross-breed with generalists via migration.
#
# Group E (islands 16–19): Volume + Trend Specialists
#   CMF, VROC, MFI, BBANDS, EMA, SMA, SUPERTREND — trend confirmation.
#   Volume islands often find the highest W/L strategies (volume = conviction).
#
# Ring topology: A→B→C→D→E→A creates a complete circuit. Explorers (C)
# discover building blocks, specialists (D/E) apply them to niche contexts,
# balanced (A) test generalization, champions (B) refine to W/L precision.
#
# 20 islands × 8 pop = 160 total · ring · 15m · max_runtime=420min
# ============================================================================

experiment_name: wave34_PREMIUM_grand_synthesis

genetic_algorithm:
  random_seed: null
  population_size: 8
  generations: 25           # time limit stops first
  mutation_rate: 0.18
  crossover_rate: 0.70
  elite_size: 2
  tournament_size: 3
  selection_method: 'rank'
  convergence_patience: 10
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.12
  mutation_cooldown_factor: 0.5
  fitness_sharing: true
  sharing_radius: 0.25
  diversity_threshold: 0.12
  allow_self_crossover: false
  random_immigrants: 2
  mode: 'single_objective'
  max_runtime_minutes: 420  # 7h hard stop (now works via generic_island_model fix)

surrogate:
  enabled: true
  min_training_samples: 60
  filter_percentile: 70
  retrain_interval: 3
  model: "gradient_boosting"
  mutate_skipped: true

generic_island_model:
  enabled: true
  num_islands: 20
  population_per_island: 8
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: false    # overridden per group below
    indicator_overlap: 0.40
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false
  islands:
    # ── Group A: Rank Balanced (islands 0–4) ─────────────────────────────
    - name: island_0A_rank_balanced
      population_size: 8
      seed: 1000
      extra_config:
        genetic_algorithm:
          selection_method: 'rank'
          mutation_rate: 0.18
          elite_size: 2
          random_immigrants: 2

    - name: island_1A_rank_balanced
      population_size: 8
      seed: 1001
      extra_config:
        genetic_algorithm:
          selection_method: 'rank'
          mutation_rate: 0.16
          elite_size: 2
          random_immigrants: 2
        fitness_weights:
          profit: 0.40
          sharpe_ratio: 0.09
          sortino_ratio: 0.04
          profit_factor: 0.12
          drawdown: 0.04
          win_rate: 0.16
          trade_frequency: 0.15

    - name: island_2A_rank_balanced
      population_size: 8
      seed: 1002
      extra_config:
        genetic_algorithm:
          selection_method: 'rank'
          mutation_rate: 0.20
          elite_size: 2
          random_immigrants: 2
        fitness_weights:
          profit: 0.36
          sharpe_ratio: 0.10
          sortino_ratio: 0.05
          profit_factor: 0.12
          drawdown: 0.05
          win_rate: 0.18
          trade_frequency: 0.14

    - name: island_3A_rank_balanced
      population_size: 8
      seed: 1003
      extra_config:
        genetic_algorithm:
          selection_method: 'rank'
          mutation_rate: 0.18
          elite_size: 3
          random_immigrants: 1

    - name: island_4A_rank_balanced
      population_size: 8
      seed: 1004
      extra_config:
        genetic_algorithm:
          selection_method: 'tournament'
          tournament_size: 3
          mutation_rate: 0.18
          elite_size: 2
          random_immigrants: 2

    # ── Group B: Tournament W/L Champions (islands 5–9) ──────────────────
    - name: island_5B_tournament_wl
      population_size: 8
      seed: 1005
      extra_config:
        genetic_algorithm:
          selection_method: 'tournament'
          tournament_size: 3
          mutation_rate: 0.18
          elite_size: 2
        fitness_weights:
          profit: 0.34
          sharpe_ratio: 0.08
          sortino_ratio: 0.04
          profit_factor: 0.14
          drawdown: 0.03
          win_rate: 0.22
          trade_frequency: 0.13
          monthly_return: 0.01
          cross_pair_consistency: 0.01
        fitness_penalties:
          min_win_rate: 0.40

    - name: island_6B_tournament_wl
      population_size: 8
      seed: 1006
      extra_config:
        genetic_algorithm:
          selection_method: 'tournament'
          tournament_size: 3
