          sortino_ratio: 0.04
          profit_factor: 0.15
          drawdown: 0.03
          win_rate: 0.26
          trade_frequency: 0.12
        fitness_penalties:
          min_win_rate: 0.42

    - name: island_8B_tournament_wl
      population_size: 8
      seed: 1008
      extra_config:
        genetic_algorithm:
          selection_method: 'tournament'
          tournament_size: 4
          mutation_rate: 0.14
          elite_size: 3
        fitness_weights:
          profit: 0.34
          sharpe_ratio: 0.08
          sortino_ratio: 0.04
          profit_factor: 0.14
          drawdown: 0.03
          win_rate: 0.22
          trade_frequency: 0.13
          monthly_return: 0.01
          cross_pair_consistency: 0.01
        fitness_penalties:
          min_win_rate: 0.40

    - name: island_9B_tournament_wl_tight
