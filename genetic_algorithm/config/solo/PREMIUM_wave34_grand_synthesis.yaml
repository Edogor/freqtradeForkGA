# ── Base config ─────────────────────────────────────────────────────────────
fitness_weights:
  profit: 0.38
  sharpe_ratio: 0.09
  sortino_ratio: 0.04
  profit_factor: 0.12
  drawdown: 0.04
  win_rate: 0.18
  trade_frequency: 0.15

fitness_bounds:
  profit_min: -5.0
  profit_max: 10.0

trade_frequency_thresholds:
  auto_scale_by_timeframe: true
  shape: 'gaussian'

fitness_penalties:
  min_trades: 80
  min_trades_per_month: 12
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.20
  min_win_rate: 0.38
  complexity_weight: 0.01

backtesting:
  timerange: "20210101-20260331"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "PEPE/USDT"
  max_open_trades: 4
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 300

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "ETH/USDT"
  validation_pairs:
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "PEPE/USDT"
  weight_train: 0.45
  weight_val: 0.55           # val-priority to strongly filter overfitting
  min_val_fitness: 0.0
  validate_top_n_only: 10

walk_forward:
  enabled: false

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 80
  max_drawdown: 0.20
  min_win_rate: 0.38
  timeframes: ["15m"]
  stoploss_range: [-0.040, -0.010]
  roi_range: [0.005, 0.025]
  max_open_trades_range: [1, 4]
  trailing_stop_positive_range: [0.005, 0.020]
  trailing_stop_offset_addition_range: [0.003, 0.012]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'ROC'
    - 'TEMA'
    - 'KAMA'
    - 'VWAP'
    - 'STOCH'
    - 'DONCHIAN'
    - 'WILLR'
    - 'AROON'
  min_per_strategy: 2
  max_per_strategy: 5        # allow richer strategies in premium run

storage:
  database: "genetic_algorithm/data/wave34_PREMIUM.db"
  strategy_dir: "user_data/strategies/wave34_PREMIUM"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave34_PREMIUM"
  checkpoint_interval: 2
  keep_history: true
  min_disk_gb: 10.0
  min_disk_gb_runtime: 5.0
  max_cache_disk_mb: 20000  # larger cache for 160-individual run

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave34_PREMIUM.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: true
  update_interval: 1
  output_dir: "genetic_algorithm/output/exploration/wave34/PREMIUM_grand_synthesis/plots"

terminal_monitor:
  enabled: true
  default_mode: "simple"

hall_of_fame:
  enabled: true
  max_size: 100              # larger HoF for premium run
  inject_count: 5
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_wave34_PREMIUM"

deflated_sharpe:
  enabled: true
