          profit_factor: 0.14
          drawdown: 0.03
          win_rate: 0.22
          trade_frequency: 0.13
          monthly_return: 0.01
          cross_pair_consistency: 0.01
        fitness_penalties:
          min_win_rate: 0.40

    - name: island_7B_tournament_wl
      population_size: 8
      seed: 1007
      extra_config:
        genetic_algorithm:
          selection_method: 'tournament'
