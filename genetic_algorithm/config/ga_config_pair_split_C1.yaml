# Pair-Split Validation Config — No Walk-Forward, No Holdout
#
# Purpose: Measure overfitting by training on one set of pairs and validating
#          on completely different pairs. This replaces time-based splits
#          (walk-forward / holdout) with a pair-based generalization test.
#
# Pair split:
#   Training:   BTC/USDT, BNB/USDT, XRP/USDT  (GA optimizes on these)
#   Validation: ETH/USDT, SOL/USDT              (unseen during optimization)
#
# Fitness:
#   composite = train_fitness * 0.6 + val_fitness * 0.4
#   pair_generalization_ratio = val_fitness / train_fitness
#     ratio near 1.0 → strategy generalizes well
#     ratio << 1.0  → overfitting to training pairs
#
# Window: 5 years (2021-03 to 2026-03), timeframe 15m
# Expected runtime: ~4–6 hours (pop 12 × 15 gens, no walk-forward overhead)
#
# Usage:
#   source .venv/bin/activate
#   python genetic_algorithm/run_ga.py \
#     --config genetic_algorithm/config/ga_config_pair_split_C1.yaml

# === Genetic Algorithm Parameters ===
genetic_algorithm:
  random_seed: null
  population_size: 12        # AP-8: pop ≤ 15 to avoid overfit
  generations: 15
  mutation_rate: 0.18        # Proven range 0.15-0.20
  crossover_rate: 0.7
  elite_size: 2              # AP-1: elite = 2-3 for small pop
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 8    # Proven patience = 8

  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.1

  fitness_sharing: false     # Keep off for pair-split baseline
  allow_self_crossover: false
  random_immigrants: 2

  mode: 'single_objective'

# === Fitness Function Weights ===
fitness_weights:
  profit: 0.25
  sharpe_ratio: 0.20
  sortino_ratio: 0.15
  profit_factor: 0.10
  drawdown: 0.15
  win_rate: 0.08
  trade_frequency: 0.07

fitness_penalties:
  min_trades: 5
  max_drawdown: 0.25
  min_win_rate: 0.30
  complexity_weight: 0.01

# === Backtesting Configuration ===
backtesting:
  # Full 5-year window — no WF/holdout time split
  timerange: "20210301-20260301"

  stake_amount: 100
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 180

  # Default pairs (overridden per split by pair_validation)
  pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "ETH/USDT"
    - "SOL/USDT"

# === Walk-Forward: DISABLED ===
walk_forward:
  enabled: false

# === Pair-Split Validation ===
# Instead of time-based splits, we split by pairs:
#   - GA sees only training pairs during backtest fitness
#   - Validation pairs are backtested separately and blended
pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "SOL/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0       # No floor — let the composite speak

# === Strategy Constraints ===
strategy_constraints:
  min_trades: 10
  max_drawdown: 0.25
  min_win_rate: 0.30
  timeframes: ["15m"]
  stoploss_range: [-0.15, -0.05]
  roi_range: [0.01, 0.08]
  max_open_trades_range: [1, 5]

# === Multi-Timeframe ===
multi_timeframe:
  enabled: false

# === Indicators ===
indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'DONCHIAN'
    - 'CMF'
    - 'VROC'
  min_per_strategy: 2
  max_per_strategy: 5

# === Mutation Details ===
mutation:
  rate: 0.18
  add_indicator_prob: 0.15
  remove_indicator_prob: 0.10
  modify_param_prob: 0.35
  modify_condition_prob: 0.25

# === Crossover ===
crossover:
  rate: 0.7
  indicator_mix_prob: 0.5

# === Monte Carlo: DISABLED ===
# Pair-split replaces MC for this experiment
monte_carlo:
  enabled: false

# === LLM: DISABLED for C1 baseline ===
llm:
  enabled: false

# === Island Model: DISABLED for C1 baseline ===
generic_island_model:
  enabled: false

island_model:
  enabled: false

# === Terminal Monitor ===
terminal_monitor:
  enabled: true
