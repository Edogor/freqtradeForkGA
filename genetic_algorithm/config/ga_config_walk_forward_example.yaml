# Walk-Forward Optimization Example Configuration
# 
# This configuration demonstrates how to enable walk-forward optimization
# to prevent overfitting and improve real-world trading performance.
#
# Usage: python genetic_algorithm/run_ga.py --config genetic_algorithm/config/ga_config_walk_forward_example.yaml

# Genetic Algorithm Configuration for FreqTrade Strategy Evolution

# === Genetic Algorithm Parameters ===
genetic_algorithm:
  random_seed: 42  # For reproducibility
  population_size: 20
  generations: 10
  mutation_rate: 0.15
  crossover_rate: 0.7
  elite_size: 3
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 10
  
  # Diversity preservation
  adaptive_mutation: true
  max_adaptation_factor: 2.0
  adaptation_step: 0.1
  fitness_sharing: true
  sharing_radius: 0.3
  diversity_threshold: 0.15
  allow_self_crossover: false
  random_immigrants: 3

# === Fitness Function Weights ===
fitness_weights:
  profit: 0.25
  sharpe_ratio: 0.15
  sortino_ratio: 0.15
  profit_factor: 0.10
  drawdown: 0.15
  win_rate: 0.10
  trade_frequency: 0.10

fitness_penalties:
  min_trades: 5
  max_drawdown: 0.30
  min_win_rate: 0.30
  complexity_weight: 0.01

# === Backtesting Configuration ===
backtesting:
  # Time range for backtesting - should be long enough for multiple windows
  # Example: 120 days allows for 3 windows with 60-day training and 15-day validation
  timerange: "20241120-20260218"  # ~90 days
  
  stake_amount: 0.05
  
  # Trading pairs - use real pairs with downloaded data
  pairs:
    - "ETH/BTC"
    - "LTC/BTC"
  
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 300

# === Walk-Forward Optimization ===
# This is the key feature for preventing overfitting!
walk_forward:
  # ✅ ENABLED - Walk-forward optimization is active
  enabled: true
  
  # Training window: 40 days
  # Each strategy will be evaluated on 40-day training windows
  train_days: 40
  
  # Validation window: 10 days
  # Performance is measured on 10-day validation windows (unseen data)
  validation_days: 10
  
  # Step size: 10 days
  # Slide forward by 10 days for each new window
  # With 90 days total, this creates ~4 walk-forward windows
  step_days: 10
  
  # Rolling mode: Fixed-size training windows
  # Alternative: 'anchored' for expanding windows
  mode: 'rolling'
  
  # Mean aggregation: Average performance across all validation windows
  # Alternatives:
  #   - 'min': Conservative - worst case performance
  #   - 'harmonic_mean': Penalizes inconsistency
  #   - 'weighted': More weight to recent windows
  aggregation: 'mean'
  
  # Minimum trades in training window
  # Skip windows with too few trades
  min_train_trades: 10

# === Strategy Constraints ===
strategy_constraints:
  min_trades: 10
  max_drawdown: 0.25
  min_win_rate: 0.35
  timeframes: ["5m", "15m", "1h"]
  stoploss_range: [-0.20, -0.05]
  roi_range: [0.01, 0.10]

# === Indicator Configuration ===
indicators:
  available:
    - "RSI"
    - "MACD"
    - "BBANDS"
    - "EMA"
    - "SMA"
    - "STOCH"
    - "ATR"
    - "ADX"
    - "CCI"
  
  max_per_strategy: 5
  min_per_strategy: 2
  
  # Indicator parameter ranges
  RSI:
    period: [7, 21]
    buy_threshold: [20, 40]
    sell_threshold: [60, 80]
  
  MACD:
    fast_period: [8, 21]
    slow_period: [21, 50]
    signal_period: [5, 14]
  
  BBANDS:
    period: [15, 30]
    std_dev: [1.5, 3.0]
  
  EMA:
    period: [5, 50]
  
  SMA:
    period: [10, 100]
  
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [20, 40]
    d_threshold: [60, 80]
  
  ATR:
    period: [10, 20]
  
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  
  CCI:
    period: [10, 30]
    buy_threshold: [-200, -100]
    sell_threshold: [100, 200]

# === Storage Configuration ===
storage:
  database: "genetic_algorithm/data/strategies_wf.db"
  strategy_dir: "user_data/strategies/ga_generated_wf"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wf"
  checkpoint_interval: 5
  keep_history: true

# === Logging Configuration ===
logging:
  level: "INFO"
  file: "genetic_algorithm/logs/ga_walk_forward.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# === Visualization Configuration ===
visualization:
  enabled: true
  update_interval: 1
  plots:
    - "fitness_evolution"
    - "diversity"
    - "top_strategies"
  output_dir: "genetic_algorithm/plots_wf"

# === Advanced Features ===
advanced:
  parallel_evaluation: false
  num_workers: 4
  enable_dry_run: false
  dry_run_duration: 7
  enable_ml_fitness: false
  enable_llm: false
  
  llm:
    provider: "grok"
    api_key: ""
    model: "grok-1"
  
  island_model:
    enabled: false
    num_islands: 4
    migration_interval: 5
    migration_size: 5
