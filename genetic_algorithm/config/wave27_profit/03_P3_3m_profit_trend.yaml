# ============================================================================
# WAVE27 — P3: 3m Profit Focused (Trend Indicators, Rank Selection)
# ============================================================================
# 3m base timeframe to capture intraday momentum earlier than 5m.
# Trend-following indicator pool: the hypothesis is that trend-following
# strategies with clear direction naturally have better risk/reward because
# they ride moves rather than picking reversals.
# Same profit-first fitness as P1/P2.
# ============================================================================

experiment_name: wave27_P3_3m_profit_trend

genetic_algorithm:
  random_seed: null
  population_size: 30
  generations: 50
  mutation_rate: 0.20
  crossover_rate: 0.7
  elite_size: 3
  tournament_size: 4
  selection_method: 'rank'
  convergence_patience: 15
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.12
  mutation_cooldown_factor: 0.5
  fitness_sharing: true
  sharing_radius: 0.22
  diversity_threshold: 0.14
  allow_self_crossover: false
  random_immigrants: 3
  mode: 'single_objective'

surrogate:
  enabled: true
  min_training_samples: 80
  filter_percentile: 55
  retrain_interval: 3
  model: "random_forest"
  mutate_skipped: true

generic_island_model:
  enabled: true
  num_islands: 10
  population_per_island: 30
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.4
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 4
    count: 2
    merge_rounds: false

# ---- PROFIT-FIRST FITNESS -----------------------------------------------
fitness_weights:
  profit: 0.42
  profit_factor: 0.22
  sharpe_ratio: 0.14
  drawdown: 0.08
  sortino_ratio: 0.06
  consistency: 0.05
  exposure_time: 0.03

fitness_bounds:
  profit_min: -30
  profit_max: 100
  profit_factor_norm: 2.0

trade_frequency_thresholds:
  auto_scale_by_timeframe: true
  shape: 'asymmetric'

fitness_penalties:
  min_trades: 150
  min_trades_per_month: 5
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.25
  min_win_rate: 0.20
  min_profit_factor: 0.85
  complexity_weight: 0.005
  pair_loss_threshold: -20.0

backtesting:
  timerange: "20240101-20260327"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "PEPE/USDT"
  max_open_trades: 3
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 360

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "XRP/USDT"
    - "PEPE/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0
  validate_top_n_only: 5

walk_forward:
  enabled: false

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 150
  max_drawdown: 0.25
  min_win_rate: 0.20
  timeframes: ["3m"]
  stoploss_range: [-0.07, -0.015]
  roi_range: [0.008, 0.06]
  max_open_trades_range: [1, 3]

multi_timeframe:
  enabled: true
  available: ['15m', '1h']
  max_timeframes: 2
  higher_timeframe_preference:
    - 'EMA'
    - 'SMA'
    - 'ATR'
    - 'SUPERTREND'
    - 'ADX'
    - 'BBANDS'

# Trend-following indicator pool
indicators:
  available:
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'MACD'
    - 'ADX'
    - 'RSI'
    - 'ATR'
    - 'BBANDS'
    - 'PSAR'
    - 'TEMA'
    - 'KAMA'
    - 'ROC'
    - 'CCI'
  min_per_strategy: 2
  max_per_strategy: 5

storage:
  database: "genetic_algorithm/data/wave27_P3.db"
  strategy_dir: "user_data/strategies/wave27_P3"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave27_P3"
  checkpoint_interval: 3
  keep_history: true
  min_disk_gb: 5.0
  min_disk_gb_runtime: 2.0
  max_cache_disk_mb: 5000

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave27_P3.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: true
  update_interval: 1
  output_dir: "genetic_algorithm/output/exploration/wave27_laptop/P3_3m_profit_trend/plots"

terminal_monitor:
  enabled: true
  default_mode: "simple"

hall_of_fame:
  enabled: true
  max_size: 50
  inject_count: 2
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_wave27_P3"

deflated_sharpe:
  enabled: true
