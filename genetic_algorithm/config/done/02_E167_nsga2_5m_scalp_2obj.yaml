# ============================================================================
# WAVE 20 — E167: NSGA-II 5m Scalping — 2-Objective Pareto
# ============================================================================
# Purpose: Multi-objective 5m scalping. 2 objectives (profit vs drawdown)
#          keeps the Pareto front 2D and easy to analyze. Combined with
#          very high trade_frequency weight to ensure all Pareto-optimal
#          solutions are active traders. No island model — pure NSGA-II
#          with larger population for better Pareto coverage.
#
# Base: E100 (NSGA-II) adapted for scalping
# Key changes: 5m timeframe, 2 objectives, no islands, tight ROI/SL,
#              large pop (20), high trade_frequency fitness weight
# ============================================================================

genetic_algorithm:
  random_seed: null
  population_size: 20
  generations: 14
  mutation_rate: 0.20
  crossover_rate: 0.75
  elite_size: 3
  tournament_size: 4
  selection_method: 'tournament'
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.1
  fitness_sharing: false
  allow_self_crossover: false
  random_immigrants: 2
  mode: 'nsga2'

nsga2:
  objectives:
    - name: 'profit'
      type: 'maximize'
      scale: 100.0
    - name: 'max_drawdown'
      type: 'minimize'
      scale: 1.0
  pareto_front_size: 15
  crowding_distance_percentile: 0.1
  min_trades: 100

fitness_weights:
  profit: 0.17
  sharpe_ratio: 0.14
  sortino_ratio: 0.08
  profit_factor: 0.07
  drawdown: 0.13
  win_rate: 0.07
  trade_frequency: 0.24
  consistency: 0.05
  exposure_time: 0.05

trade_frequency_thresholds:
  very_few: 60
  few: 200
  ideal_min: 400
  ideal_max: 2000
  moderate_excess: 4000
  shape: 'asymmetric'

fitness_penalties:
  min_trades: 100
  min_trades_per_month: 20
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.22
  min_win_rate: 0.28
  complexity_weight: 0.01

backtesting:
  timerange: "20210301-20260301"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  max_open_trades: 5
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 300

walk_forward:
  enabled: false

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "SOL/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 100
  max_drawdown: 0.22
  min_win_rate: 0.28
  timeframes: ["5m"]
  stoploss_range: [-0.04, -0.008]
  roi_range: [0.002, 0.018]
  max_open_trades_range: [2, 5]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'CCI'
    - 'WILLR'
    - 'ROC'
    - 'TEMA'
    - 'KAMA'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'AROON'
  min_per_strategy: 2
  max_per_strategy: 5

island_model:
  enabled: false

llm:
  enabled: false

terminal_monitor:
  enabled: true
