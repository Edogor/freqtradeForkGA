# ============================================================================
# WAVE34 — HI-D: Evolution Tactics (Heterogeneous Islands)
# ============================================================================
# Hypothesis: The same fitness landscape looks very different depending on
#             HOW you explore it. Three evolutionary tactics compete:
#
#             - Exploratory islands (mutation=0.30, elite=1, immigrants=3):
#               High mutation destroys local optima, immigrants bring fresh
#               genetic material, tiny elite prevents premature convergence.
#               These islands range far but converge slowly.
#
#             - Standard islands (mutation=0.18, elite=2): The proven
#               baseline that has produced all our best results so far.
#
#             - Exploitative islands (mutation=0.10, elite=3, immigrants=1):
#               Low mutation makes small improvements, large elite preserves
#               the best solutions, minimal random disruption. These islands
#               refine what they receive from migrating explorers.
#
#             Through ring migration, the three tactics form a pipeline:
#             explorers discover, balanced islands test, exploiters refine.
#
# 12 islands × 8 pop = 96 total · ring · 15m · 7 gens ≈ 3.8h
# ============================================================================

experiment_name: wave34_HID_evo_tactics

genetic_algorithm:
  random_seed: null
  population_size: 8
  generations: 7
  mutation_rate: 0.18         # default; overridden per group
  crossover_rate: 0.70
  elite_size: 2               # default; overridden per group
  tournament_size: 3
  selection_method: 'rank'
  convergence_patience: 6
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.12
  mutation_cooldown_factor: 0.5
  fitness_sharing: true
  sharing_radius: 0.25
  diversity_threshold: 0.12
  allow_self_crossover: false
  random_immigrants: 2        # default; overridden per group
  mode: 'single_objective'

surrogate:
  enabled: true
  min_training_samples: 60
  filter_percentile: 70
  retrain_interval: 3
  model: "gradient_boosting"
  mutate_skipped: true

generic_island_model:
  enabled: true
  num_islands: 12
  population_per_island: 8
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: false
    indicator_overlap: 0.40
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false
  islands:
    # ── Group 1: Exploratory (high mutation, few elites) ─────────────────
    - name: island_0_explorer
      population_size: 8
      seed: 400
      extra_config:
        genetic_algorithm:
          mutation_rate: 0.30
          elite_size: 1
          random_immigrants: 3
          adaptive_mutation: true
          max_adaptation_factor: 3.5
          selection_method: 'rank'

    - name: island_1_explorer
      population_size: 8
      seed: 401
      extra_config:
        genetic_algorithm:
          mutation_rate: 0.30
          elite_size: 1
          random_immigrants: 3
          adaptive_mutation: true
          max_adaptation_factor: 3.5
          selection_method: 'rank'

    - name: island_2_explorer
      population_size: 8
      seed: 402
      extra_config:
        genetic_algorithm:
          mutation_rate: 0.30
          elite_size: 1
          random_immigrants: 3
          adaptive_mutation: true
          max_adaptation_factor: 3.5
          selection_method: 'tournament'
          tournament_size: 2

    - name: island_3_explorer
      population_size: 8
      seed: 403
      extra_config:
        genetic_algorithm:
          mutation_rate: 0.30
          elite_size: 1
          random_immigrants: 3
          adaptive_mutation: true
          max_adaptation_factor: 3.5
          selection_method: 'tournament'
          tournament_size: 2

    # ── Group 2: Balanced (proven standard config) ────────────────────────
    - name: island_4_balanced
      population_size: 8
      seed: 404
      extra_config:
        genetic_algorithm:
          mutation_rate: 0.18
          elite_size: 2
          random_immigrants: 2
          selection_method: 'rank'

    - name: island_5_balanced
      population_size: 8
      seed: 405
      extra_config:
        genetic_algorithm:
          mutation_rate: 0.18
          elite_size: 2
          random_immigrants: 2
          selection_method: 'rank'

    - name: island_6_balanced
      population_size: 8
      seed: 406
      extra_config:
        genetic_algorithm:
          mutation_rate: 0.18
          elite_size: 2
          random_immigrants: 2
          selection_method: 'tournament'
          tournament_size: 3

    - name: island_7_balanced
      population_size: 8
      seed: 407
      extra_config:
        genetic_algorithm:
          mutation_rate: 0.18
          elite_size: 2
          random_immigrants: 2
          selection_method: 'tournament'
          tournament_size: 3

    # ── Group 3: Exploitative (low mutation, strong elitism) ──────────────
    - name: island_8_exploiter
      population_size: 8
      seed: 408
      extra_config:
        genetic_algorithm:
          mutation_rate: 0.10
          elite_size: 3
          random_immigrants: 1
          adaptive_mutation: true
          max_adaptation_factor: 1.5   # limited adaptation to stay exploitative
          selection_method: 'rank'

    - name: island_9_exploiter
      population_size: 8
      seed: 409
      extra_config:
        genetic_algorithm:
          mutation_rate: 0.10
          elite_size: 3
          random_immigrants: 1
          adaptive_mutation: true
          max_adaptation_factor: 1.5
          selection_method: 'rank'

    - name: island_10_exploiter
      population_size: 8
      seed: 410
      extra_config:
        genetic_algorithm:
          mutation_rate: 0.10
          elite_size: 3
          random_immigrants: 1
          adaptive_mutation: true
          max_adaptation_factor: 1.5
          selection_method: 'tournament'
          tournament_size: 4    # large tournament on small pop = greedy best-selection

    - name: island_11_exploiter
      population_size: 8
      seed: 411
      extra_config:
        genetic_algorithm:
          mutation_rate: 0.10
          elite_size: 3
          random_immigrants: 1
          adaptive_mutation: true
          max_adaptation_factor: 1.5
          selection_method: 'tournament'
          tournament_size: 4

# ── Base config ─────────────────────────────────────────────────────────────
fitness_weights:
  profit: 0.38
  sharpe_ratio: 0.09
  sortino_ratio: 0.04
  profit_factor: 0.12
  drawdown: 0.04
  win_rate: 0.18
  trade_frequency: 0.15

fitness_bounds:
  profit_min: -5.0
  profit_max: 10.0

trade_frequency_thresholds:
  auto_scale_by_timeframe: true
  shape: 'gaussian'

fitness_penalties:
  min_trades: 80
  min_trades_per_month: 12
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.20
  min_win_rate: 0.38
  complexity_weight: 0.01

backtesting:
  timerange: "20210101-20260331"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  max_open_trades: 4
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 300

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "ETH/USDT"
  validation_pairs:
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  weight_train: 0.50
  weight_val: 0.50
  min_val_fitness: 0.0
  validate_top_n_only: 8

walk_forward:
  enabled: false

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 80
  max_drawdown: 0.20
  min_win_rate: 0.38
  timeframes: ["15m"]
  stoploss_range: [-0.040, -0.010]
  roi_range: [0.005, 0.025]
  max_open_trades_range: [1, 4]
  trailing_stop_positive_range: [0.005, 0.020]
  trailing_stop_offset_addition_range: [0.003, 0.012]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'ROC'
    - 'TEMA'
    - 'KAMA'
    - 'VWAP'
    - 'STOCH'
    - 'DONCHIAN'
    - 'WILLR'
    - 'AROON'
  min_per_strategy: 2
  max_per_strategy: 4

storage:
  database: "genetic_algorithm/data/wave34_HID.db"
  strategy_dir: "user_data/strategies/wave34_HID"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave34_HID"
  checkpoint_interval: 2
  keep_history: true
  min_disk_gb: 5.0
  min_disk_gb_runtime: 2.0
  max_cache_disk_mb: 8000

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave34_HID.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: true
  update_interval: 1
  output_dir: "genetic_algorithm/output/exploration/wave34/HID_evo_tactics/plots"

terminal_monitor:
  enabled: true
  default_mode: "simple"

hall_of_fame:
  enabled: true
  max_size: 50
  inject_count: 3
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_wave34_HID"

deflated_sharpe:
  enabled: true
