# ============================================================================
# WAVE34 — HI-C: Multi-Timeframe Islands (Heterogeneous Islands)
# ============================================================================
# Hypothesis: Within ONE island model, half the islands evolve strategies on
#             15m candles and the other half on 30m candles. 30m islands
#             backtest ~2× faster (half the candles), so they complete gens
#             faster — contributing more migrants per wall-clock hour than
#             15m islands. This asymmetry means the 30m "fast lane" pushes
#             good signals into the 15m "quality lane" through ring migration.
#
#             The key experiment question: can strategies optimised on 30m
#             (wider SL/ROI, fewer signals, more noise filtered) improve 15m
#             strategies when they migrate? And vice versa — do 15m precision
#             tactics refine 30m strategies?
#
#             This is NOVEL — no prior wave has mixed timeframes within a
#             single island model.
#
# 15m islands (0–5): stoploss [-0.040, -0.010], roi [0.005, 0.025]
# 30m islands (6–11): stoploss [-0.060, -0.015], roi [0.008, 0.035]
# 12 islands × 8 pop = 96 total · ring · 10 gens
# Estimated time: ~25% faster than pure 15m → ~3.5h for 10 gens
# ============================================================================

experiment_name: wave34_HIC_multitf_islands

genetic_algorithm:
  random_seed: null
  population_size: 8
  generations: 10
  mutation_rate: 0.18
  crossover_rate: 0.70
  elite_size: 2
  tournament_size: 3
  selection_method: 'rank'
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.12
  mutation_cooldown_factor: 0.5
  fitness_sharing: true
  sharing_radius: 0.25
  diversity_threshold: 0.12
  allow_self_crossover: false
  random_immigrants: 2
  mode: 'single_objective'

surrogate:
  enabled: true
  min_training_samples: 60
  filter_percentile: 70
  retrain_interval: 3
  model: "gradient_boosting"
  mutate_skipped: true

generic_island_model:
  enabled: true
  num_islands: 12
  population_per_island: 8
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: false
    indicator_overlap: 0.40
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false
  islands:
    # ── Group 1: 15m precision islands (islands 0–5) ─────────────────────
    - name: island_0_15m
      population_size: 8
      seed: 300
      extra_config:
        strategy_constraints:
          timeframes: ["15m"]
          stoploss_range: [-0.040, -0.010]
          roi_range: [0.005, 0.025]
          trailing_stop_positive_range: [0.005, 0.020]
          trailing_stop_offset_addition_range: [0.003, 0.012]
        fitness_penalties:
          min_trades: 80
          min_trades_per_month: 12

    - name: island_1_15m
      population_size: 8
      seed: 301
      extra_config:
        strategy_constraints:
          timeframes: ["15m"]
          stoploss_range: [-0.040, -0.010]
          roi_range: [0.005, 0.025]
          trailing_stop_positive_range: [0.005, 0.020]
