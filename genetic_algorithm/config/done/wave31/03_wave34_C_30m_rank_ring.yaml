# ============================================================================
# WAVE34 — C: 30m Rank Ring (Speed + Diversity)
# ============================================================================
# Hypothesis: 30m timeframe has ~half the candles of 15m → ~2× faster per
#             generation. With 12 islands × 8 pop = 96 total, we can run 10
#             meaningful generations in ~3.9h vs only 7 gens for 15m configs.
#             More generations = more evolutionary pressure. Wider ROI and SL
#             ranges match 30m candle dynamics (larger swings, less noise).
#             Rank selection for consistent, stable convergence.
#
# 30m vs 15m adjustments:
#   - roi_range: [0.008, 0.035] (wider for larger candle swings)
#   - stoploss_range: [-0.060, -0.015] (wider to avoid stop-hunts)
#   - min_trades: 60 (lower frequency natural at 30m)
#   - min_trades_per_month: 8 (lower per-month floor for 30m)
#   - trade_frequency weight raised 0.14→0.16 (compensate natural lower freq)
#
# Timing estimate:
#   12 islands × 8 pop = 96 total, 30m ≈ 0.5× per-gen time vs 15m
#   10 gens ≈ 3.9h
#
# Selection: rank · Topology: ring · TF: 30m
# Train: BTC/USDT + ETH/USDT  |  Val: SOL/USDT + BNB/USDT + XRP/USDT
# ============================================================================

experiment_name: wave34_C_30m_rank_ring

genetic_algorithm:
  random_seed: null
  population_size: 8
  generations: 10
  mutation_rate: 0.18
  crossover_rate: 0.70
  elite_size: 2
  tournament_size: 3
  selection_method: 'rank'
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.12
  mutation_cooldown_factor: 0.5
  fitness_sharing: true
  sharing_radius: 0.25
  diversity_threshold: 0.12
  allow_self_crossover: false
  random_immigrants: 2
  mode: 'single_objective'

surrogate:
  enabled: true
  min_training_samples: 60
  filter_percentile: 70
  retrain_interval: 3
  model: "gradient_boosting"
  mutate_skipped: true

generic_island_model:
  enabled: true
  num_islands: 12
  population_per_island: 8
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.40
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false

# ── Fitness Weights — Balanced with 30m trade frequency boost ─────────────
fitness_weights:
  profit: 0.36
  sharpe_ratio: 0.10
  sortino_ratio: 0.05
  profit_factor: 0.10
  drawdown: 0.04
  win_rate: 0.18
  trade_frequency: 0.16     # ↑ compensate lower natural frequency at 30m
  monthly_stability: 0.01
  cross_pair: 0.00

fitness_bounds:
  profit_min: -5.0
  profit_max: 10.0

trade_frequency_thresholds:
  auto_scale_by_timeframe: true
  shape: 'gaussian'

fitness_penalties:
  min_trades: 60            # ↓ appropriate for 30m timeframe
  min_trades_per_month: 8   # ↓ lower floor for 30m natural frequency
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.20
  min_win_rate: 0.38
  complexity_weight: 0.01

backtesting:
  timerange: "20210101-20260331"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  max_open_trades: 4
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 300

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "ETH/USDT"
  validation_pairs:
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  weight_train: 0.50
  weight_val: 0.50
  min_val_fitness: 0.0
  validate_top_n_only: 8

walk_forward:
  enabled: false

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 60
  max_drawdown: 0.20
  min_win_rate: 0.38
  timeframes: ["30m"]
  stoploss_range: [-0.060, -0.015]    # wider for 30m candle dynamics
  roi_range: [0.008, 0.035]           # wider ROI targets at 30m
  max_open_trades_range: [1, 4]
  trailing_stop_positive_range: [0.006, 0.025]
  trailing_stop_offset_addition_range: [0.004, 0.015]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'ROC'
    - 'TEMA'
    - 'KAMA'
    - 'VWAP'
    - 'STOCH'
    - 'DONCHIAN'
    - 'WILLR'
    - 'AROON'
  min_per_strategy: 2
  max_per_strategy: 4

storage:
  database: "genetic_algorithm/data/wave34_C.db"
  strategy_dir: "user_data/strategies/wave34_C"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave34_C"
  checkpoint_interval: 2
  keep_history: true
  min_disk_gb: 5.0
  min_disk_gb_runtime: 2.0
  max_cache_disk_mb: 8000

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave34_C.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: true
  update_interval: 1
  output_dir: "genetic_algorithm/output/exploration/wave34/C_30m_rank_ring/plots"

terminal_monitor:
  enabled: true
  default_mode: "simple"

hall_of_fame:
  enabled: true
  max_size: 50
  inject_count: 3
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_wave34_C"

deflated_sharpe:
  enabled: true
