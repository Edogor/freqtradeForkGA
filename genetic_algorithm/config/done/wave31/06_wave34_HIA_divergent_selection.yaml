# ============================================================================
# WAVE34 — HI-A: Divergent Selection (Heterogeneous Islands)
# ============================================================================
# Hypothesis: Within a single island model, different islands pursue
#             fundamentally different evolutionary strategies simultaneously:
#             - Islands 0–3 (rank, balanced): stable, consistent quality
#             - Islands 4–7 (tournament, W/L champion): hunt for exceptional
#               high-win-rate outliers (like wave32_H's island_3 fitness 0.4571)
#             - Islands 8–11 (rank, profit-first): maximise raw profit
#
#             Ring migration forces knowledge exchange between the three
#             "tribes", creating evolutionary pressure that no homogeneous
#             setup can replicate. The profit-first islands may find strategies
#             the W/L islands refine into safe, high-quality solutions.
#
# Requires: deep-merge extra_config fix in generic_island_model.py (done).
# 12 islands × 8 pop = 96 total · ring · 15m · 7 gens ≈ 3.8h
# ============================================================================

experiment_name: wave34_HIA_divergent_selection

genetic_algorithm:
  random_seed: null
  population_size: 8          # default per island; overridden per group
  generations: 7
  mutation_rate: 0.18         # default; overridden per group
  crossover_rate: 0.70
  elite_size: 2
  tournament_size: 3
  selection_method: 'rank'    # default; overridden per group
  convergence_patience: 6
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.12
  mutation_cooldown_factor: 0.5
  fitness_sharing: true
  sharing_radius: 0.25
  diversity_threshold: 0.12
  allow_self_crossover: false
  random_immigrants: 2
  mode: 'single_objective'

surrogate:
  enabled: true
  min_training_samples: 60
  filter_percentile: 70
  retrain_interval: 3
  model: "gradient_boosting"
  mutate_skipped: true

generic_island_model:
  enabled: true
  num_islands: 12             # overridden by explicit islands list below
  population_per_island: 8
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: false    # pools disabled — we handle all overrides below
    indicator_overlap: 0.40
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false
  islands:
    # ── Group 1: Rank selection, balanced fitness (islands 0–3) ──────────
    - name: island_0_rank_balanced
      population_size: 8
      seed: 100
      extra_config:
        genetic_algorithm:
          selection_method: 'rank'
          mutation_rate: 0.18
        fitness_weights:
          profit: 0.38
          sharpe_ratio: 0.09
          sortino_ratio: 0.04
          profit_factor: 0.12
          drawdown: 0.04
          win_rate: 0.18
          trade_frequency: 0.15

    - name: island_1_rank_balanced
      population_size: 8
      seed: 101
      extra_config:
        genetic_algorithm:
          selection_method: 'rank'
          mutation_rate: 0.18
        fitness_weights:
          profit: 0.38
          sharpe_ratio: 0.09
          sortino_ratio: 0.04
          profit_factor: 0.12
          drawdown: 0.04
          win_rate: 0.18
          trade_frequency: 0.15

    - name: island_2_rank_balanced
      population_size: 8
      seed: 102
      extra_config:
        genetic_algorithm:
          selection_method: 'rank'
          mutation_rate: 0.18
        fitness_weights:
          profit: 0.38
          sharpe_ratio: 0.09
          sortino_ratio: 0.04
          profit_factor: 0.12
          drawdown: 0.04
          win_rate: 0.18
          trade_frequency: 0.15

    - name: island_3_rank_balanced
      population_size: 8
      seed: 103
      extra_config:
        genetic_algorithm:
          selection_method: 'rank'
          mutation_rate: 0.18
        fitness_weights:
          profit: 0.38
          sharpe_ratio: 0.09
          sortino_ratio: 0.04
          profit_factor: 0.12
          drawdown: 0.04
          win_rate: 0.18
          trade_frequency: 0.15

    # ── Group 2: Tournament selection, W/L champion (islands 4–7) ───────
    - name: island_4_tourn_wl
      population_size: 8
      seed: 104
      extra_config:
        genetic_algorithm:
          selection_method: 'tournament'
          tournament_size: 3
          mutation_rate: 0.20
        fitness_weights:
          profit: 0.34
          sharpe_ratio: 0.08
          sortino_ratio: 0.04
          profit_factor: 0.14
          drawdown: 0.03
          win_rate: 0.22
          trade_frequency: 0.13
          monthly_stability: 0.01
