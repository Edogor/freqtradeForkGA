# ============================================================================
# WAVE34 — E: 15m Rank Ring, Ultra-Islands (10 × 6)
# ============================================================================
# Hypothesis: Push the "more islands" principle to the limit. 10 small islands
#             of only 6 individuals each forces heavy reliance on migration for
#             knowledge sharing — each island is too small to converge alone,
#             so the ring topology actively shapes evolution. More frequent
#             migration (every 2 gens) keeps islands from drifting. Result:
#             maximum diversity across a highly connected island graph.
#
# Key differences from wave34_A:
#   - 10 islands × 6 pop = 60 total (vs 8×8=64 in A)
#   - migration interval = 2 (every 2 gens, vs 3 in A) for small-pop cohesion
#   - elite_size = 1 (smaller per-island pop, less room for elitism)
#   - min_training_samples = 50 (surrogate warms up during gen1 with 60 samples)
#   - 4 validation pairs (SOL+BNB+XRP+PEPE) for broader generalization test
#   - profit weight slightly higher (0.38) for primary objective emphasis
#
# Timing estimate:
#   10 islands × 6 pop = 60 total (ratio 0.625 vs wave33_C's 96)
#   Gen1–4: ~158min, Gen5: +34min, Gen6: +21min → 7 gens ≈ 3.9h
#
# Selection: rank · Topology: ring · TF: 15m
# Train: BTC/USDT + ETH/USDT  |  Val: SOL/USDT + BNB/USDT + XRP/USDT + PEPE/USDT
# ============================================================================

experiment_name: wave34_E_15m_rank_ultra_islands

genetic_algorithm:
  random_seed: null
  population_size: 6
  generations: 7
  mutation_rate: 0.20        # slightly higher mutation for small pop diversity
  crossover_rate: 0.70
  elite_size: 1              # only 1 elite per island (pop too small for 2)
  tournament_size: 2         # fallback if selection_method changes; not used for rank
  selection_method: 'rank'
  convergence_patience: 6
  adaptive_mutation: true
  max_adaptation_factor: 3.0  # allow stronger adaptation in small pop
  adaptation_step: 0.15
  mutation_cooldown_factor: 0.5
  fitness_sharing: true
  sharing_radius: 0.20        # smaller radius for tight small-pop islands
  diversity_threshold: 0.10
  allow_self_crossover: false
  random_immigrants: 1        # 1 immigrant per island (vs 2) for small pop
  mode: 'single_objective'

surrogate:
  enabled: true
  min_training_samples: 50   # ↓ warms up in gen1 with 60 total samples
  filter_percentile: 70
  retrain_interval: 2        # retrain more often with small population
  model: "gradient_boosting"
  mutate_skipped: true

generic_island_model:
  enabled: true
  num_islands: 10
  population_per_island: 6
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.35  # slightly less overlap = more specialization
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 2              # ↑ more frequent migration (every 2 gens)
    count: 2
    merge_rounds: false

# ── Fitness Weights — Profit primary, W/L secondary ───────────────────────
fitness_weights:
  profit: 0.38              # primary: profit most important (user)
  sharpe_ratio: 0.09
  sortino_ratio: 0.04
  profit_factor: 0.12
  drawdown: 0.03
  win_rate: 0.18
  trade_frequency: 0.15
  monthly_stability: 0.01
  cross_pair: 0.00

fitness_bounds:
  profit_min: -5.0
  profit_max: 10.0

trade_frequency_thresholds:
  auto_scale_by_timeframe: true
  shape: 'gaussian'

fitness_penalties:
  min_trades: 80
  min_trades_per_month: 12
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.20
  min_win_rate: 0.38
  complexity_weight: 0.01

backtesting:
  timerange: "20210101-20260331"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "PEPE/USDT"
  max_open_trades: 4
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 300

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "ETH/USDT"
  validation_pairs:
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "PEPE/USDT"           # widest validation for broader generalization
  weight_train: 0.50
  weight_val: 0.50
  min_val_fitness: 0.0
  validate_top_n_only: 8

walk_forward:
  enabled: false

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 80
  max_drawdown: 0.20
  min_win_rate: 0.38
  timeframes: ["15m"]
  stoploss_range: [-0.040, -0.010]
  roi_range: [0.005, 0.025]
  max_open_trades_range: [1, 4]
  trailing_stop_positive_range: [0.005, 0.020]
  trailing_stop_offset_addition_range: [0.003, 0.012]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'ROC'
    - 'TEMA'
    - 'KAMA'
    - 'VWAP'
    - 'STOCH'
    - 'DONCHIAN'
    - 'WILLR'
    - 'AROON'
  min_per_strategy: 2
  max_per_strategy: 4

storage:
  database: "genetic_algorithm/data/wave34_E.db"
  strategy_dir: "user_data/strategies/wave34_E"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave34_E"
  checkpoint_interval: 2
  keep_history: true
  min_disk_gb: 5.0
  min_disk_gb_runtime: 2.0
  max_cache_disk_mb: 6000

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave34_E.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: true
  update_interval: 1
  output_dir: "genetic_algorithm/output/exploration/wave34/E_15m_rank_ultra_islands/plots"

terminal_monitor:
  enabled: true
  default_mode: "simple"

hall_of_fame:
  enabled: true
  max_size: 50
  inject_count: 3
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_wave34_E"

deflated_sharpe:
  enabled: true
