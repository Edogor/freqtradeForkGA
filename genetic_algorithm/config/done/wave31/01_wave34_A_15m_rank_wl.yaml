# ============================================================================
# WAVE34 — A: 15m Rank Ring, W/L Focus
# ============================================================================
# Hypothesis: wave32_A's consistent rank selection + wave33_C's fixed profit
#             bounds (-5/+10) + boosted win_rate and profit_factor weights to
#             push GA toward high W/L scalping strategies. ring topology for
#             stable, gradual knowledge sharing between islands.
#
# Design choices vs wave33_C:
#   - Reduced pop per island (12→8) for faster gens; compensated by 8 islands
#   - win_rate weight raised 0.09→0.18, profit_factor 0.08→0.12 (W/L focus)
#   - trade_frequency raised 0.07→0.14 (force active scalping)
#   - sharpe/sortino reduced (not user priority)
#   - min_win_rate penalty raised 0.35→0.38
#   - Kept fixed profit bounds (-5/+10): 4× stronger gradient than old 0-50
#
# Timing estimate:
#   8 islands × 8 pop = 64 total (ratio 0.667 vs wave33_C's 96)
#   Gen1–4: ~169min, Gen5: +36min, Gen6: +23min → 7 gens ≈ 3.8h
#
# Selection: rank · Topology: ring · TF: 15m
# Train: BTC/USDT + ETH/USDT  |  Val: SOL/USDT + BNB/USDT + XRP/USDT
# ============================================================================

experiment_name: wave34_A_15m_rank_wl

genetic_algorithm:
  random_seed: null
  population_size: 8
  generations: 7
  mutation_rate: 0.18
  crossover_rate: 0.70
  elite_size: 2
  tournament_size: 3
  selection_method: 'rank'
  convergence_patience: 6
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.12
  mutation_cooldown_factor: 0.5
  fitness_sharing: true
  sharing_radius: 0.25
  diversity_threshold: 0.12
  allow_self_crossover: false
  random_immigrants: 2
  mode: 'single_objective'

surrogate:
  enabled: true
  min_training_samples: 60
  filter_percentile: 70
  retrain_interval: 3
  model: "gradient_boosting"
  mutate_skipped: true

generic_island_model:
  enabled: true
  num_islands: 8
  population_per_island: 8
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.40
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false

# ── Fitness Weights — W/L Focus ────────────────────────────────────────────
fitness_weights:
  profit: 0.36
  sharpe_ratio: 0.08
  sortino_ratio: 0.04
  profit_factor: 0.12       # ↑ W/L ratio pressure
  drawdown: 0.04
  win_rate: 0.18            # ↑ win rate priority
  trade_frequency: 0.14     # ↑ active scalping
  monthly_stability: 0.02
  cross_pair: 0.02

fitness_bounds:
  profit_min: -5.0
  profit_max: 10.0          # tight range = full gradient axis used

trade_frequency_thresholds:
  auto_scale_by_timeframe: true
  shape: 'gaussian'

fitness_penalties:
  min_trades: 80
  min_trades_per_month: 12
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.20
  min_win_rate: 0.38        # ↑ from 0.35 to enforce W/L
  complexity_weight: 0.01

backtesting:
  timerange: "20210101-20260331"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  max_open_trades: 4
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 300

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "ETH/USDT"
  validation_pairs:
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  weight_train: 0.50
  weight_val: 0.50
  min_val_fitness: 0.0
  validate_top_n_only: 8

walk_forward:
  enabled: false

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 80
  max_drawdown: 0.20
  min_win_rate: 0.38
  timeframes: ["15m"]
  stoploss_range: [-0.040, -0.010]
  roi_range: [0.005, 0.025]
  max_open_trades_range: [1, 4]
  trailing_stop_positive_range: [0.005, 0.020]
  trailing_stop_offset_addition_range: [0.003, 0.012]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'ROC'
    - 'TEMA'
    - 'KAMA'
    - 'VWAP'
    - 'STOCH'
    - 'DONCHIAN'
    - 'WILLR'
    - 'AROON'
  min_per_strategy: 2
  max_per_strategy: 4

storage:
  database: "genetic_algorithm/data/wave34_A.db"
  strategy_dir: "user_data/strategies/wave34_A"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave34_A"
  checkpoint_interval: 2
  keep_history: true
  min_disk_gb: 5.0
  min_disk_gb_runtime: 2.0
  max_cache_disk_mb: 6000

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave34_A.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: true
  update_interval: 1
  output_dir: "genetic_algorithm/output/exploration/wave34/A_15m_rank_wl/plots"

terminal_monitor:
  enabled: true
  default_mode: "simple"

hall_of_fame:
  enabled: true
  max_size: 50
  inject_count: 3
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_wave34_A"

deflated_sharpe:
  enabled: true
