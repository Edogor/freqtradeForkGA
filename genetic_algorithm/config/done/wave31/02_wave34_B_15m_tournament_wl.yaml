# ============================================================================
# WAVE34 — B: 15m Tournament Ring, W/L Champion
# ============================================================================
# Hypothesis: Tournament selection (like wave32_H that produced fitness=0.4571,
#             Sharpe=1.28, 5/5 SAFE) combined with maximum W/L pressure.
#             Tournament tends to find exceptional outlier strategies faster
#             than rank at the cost of higher variance. With strong win_rate
#             and profit_factor weights, the GA should hunt for strategies
#             that win more often AND larger relative to losses.
#
# Design choices vs wave34_A:
#   - selection_method: tournament (vs rank) — finds outliers faster
#   - win_rate raised to 0.22 (↑↑ maximum W/L pressure)
#   - profit_factor raised to 0.14 (↑ enforces win/loss magnitude ratio)
#   - profit slightly reduced 0.36→0.34 to make room for W/L
#   - min_win_rate penalty raised to 0.40 (↑↑ hard W/L filter)
#
# Timing estimate: 8 islands × 8 pop = 64 total → 7 gens ≈ 3.8h (same as A)
# Fair comparison to A: same island/pop/gens/pairs, only selection differs
#
# Selection: tournament(3) · Topology: ring · TF: 15m
# Train: BTC/USDT + ETH/USDT  |  Val: SOL/USDT + BNB/USDT + XRP/USDT
# ============================================================================

experiment_name: wave34_B_15m_tournament_wl

genetic_algorithm:
  random_seed: null
  population_size: 8
  generations: 7
  mutation_rate: 0.18
  crossover_rate: 0.70
  elite_size: 2
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 6
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.12
  mutation_cooldown_factor: 0.5
  fitness_sharing: true
  sharing_radius: 0.25
  diversity_threshold: 0.12
  allow_self_crossover: false
  random_immigrants: 2
  mode: 'single_objective'

surrogate:
  enabled: true
  min_training_samples: 60
  filter_percentile: 70
  retrain_interval: 3
  model: "gradient_boosting"
  mutate_skipped: true

generic_island_model:
  enabled: true
  num_islands: 8
  population_per_island: 8
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.40
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false

# ── Fitness Weights — Maximum W/L ─────────────────────────────────────────
fitness_weights:
  profit: 0.34
  sharpe_ratio: 0.08
  sortino_ratio: 0.04
  profit_factor: 0.14       # ↑↑ win/loss magnitude ratio
  drawdown: 0.03
  win_rate: 0.22            # ↑↑ maximum win rate priority
  trade_frequency: 0.13
  monthly_stability: 0.01
  cross_pair: 0.01

fitness_bounds:
  profit_min: -5.0
  profit_max: 10.0

trade_frequency_thresholds:
  auto_scale_by_timeframe: true
  shape: 'gaussian'

fitness_penalties:
  min_trades: 80
  min_trades_per_month: 12
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.20
  min_win_rate: 0.40        # ↑↑ hard W/L filter
  complexity_weight: 0.01

backtesting:
  timerange: "20210101-20260331"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  max_open_trades: 4
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 300

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "ETH/USDT"
  validation_pairs:
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  weight_train: 0.50
  weight_val: 0.50
  min_val_fitness: 0.0
  validate_top_n_only: 8

walk_forward:
  enabled: false

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 80
  max_drawdown: 0.20
  min_win_rate: 0.40
  timeframes: ["15m"]
  stoploss_range: [-0.040, -0.010]
  roi_range: [0.005, 0.025]
  max_open_trades_range: [1, 4]
  trailing_stop_positive_range: [0.005, 0.020]
  trailing_stop_offset_addition_range: [0.003, 0.012]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'ROC'
    - 'TEMA'
    - 'KAMA'
    - 'VWAP'
    - 'STOCH'
    - 'DONCHIAN'
    - 'WILLR'
    - 'AROON'
  min_per_strategy: 2
  max_per_strategy: 4

storage:
  database: "genetic_algorithm/data/wave34_B.db"
  strategy_dir: "user_data/strategies/wave34_B"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave34_B"
  checkpoint_interval: 2
  keep_history: true
  min_disk_gb: 5.0
  min_disk_gb_runtime: 2.0
  max_cache_disk_mb: 6000

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave34_B.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: true
  update_interval: 1
  output_dir: "genetic_algorithm/output/exploration/wave34/B_15m_tournament_wl/plots"

terminal_monitor:
  enabled: true
  default_mode: "simple"

hall_of_fame:
  enabled: true
  max_size: 50
  inject_count: 3
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_wave34_B"

deflated_sharpe:
  enabled: true
