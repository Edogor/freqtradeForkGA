# ============================================================================
# WAVE 21 — E177: Defensive FC (Capital Preservation Focus)
# ============================================================================
# Purpose: Test whether a capital-preservation-first approach finds different
#          (and possibly profitable) local optima. All wave 14 experiments had
#          drawdown weight of 0.12 — this pushes it to 0.20, making it the
#          second-strongest signal after profit (0.25). Tighter stoploss and
#          ROI ranges force more conservative entries/exits. The hypothesis is
#          that by limiting downside risk more aggressively, the GA may discover
#          strategies that accumulate small, consistent gains.
#
# Base: E170 (FC topology — strongest topology in wave 14)
# Key changes: drawdown=0.20 (was 0.12), profit=0.25, tighter stoploss
#   [-0.05, -0.015] (was [-0.08, -0.02]), tighter ROI [0.003, 0.025]
#   (was [0.005, 0.04]), pop=12 elite=3, max_drawdown penalty=0.15
# Expected: Lower drawdowns, possibly small but consistent profits
# ============================================================================

genetic_algorithm:
  random_seed: null
  population_size: 12
  generations: 12
  mutation_rate: 0.18
  crossover_rate: 0.7
  elite_size: 3
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 10
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.1
  fitness_sharing: false
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'single_objective'

generic_island_model:
  enabled: true
  num_islands: 8
  population_per_island: 12
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5
    pair_rotation: false
  migration:
    topology: 'fully_connected'
    interval: 3
    count: 2
    merge_rounds: false

fitness_weights:
  profit: 0.25
  sharpe_ratio: 0.12
  sortino_ratio: 0.08
  profit_factor: 0.08
  drawdown: 0.20
  win_rate: 0.06
  trade_frequency: 0.08
  monthly_stability: 0.05
  cross_pair: 0.04
  drawdown_duration: 0.02
  consecutive_losses: 0.02

trade_frequency_thresholds:
  very_few: 40
  few: 120
  ideal_min: 240
  ideal_max: 800
  moderate_excess: 1200
  shape: 'asymmetric'

fitness_penalties:
  min_trades: 100
  min_trades_per_month: 20
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.15
  min_win_rate: 0.30
  complexity_weight: 0.01

backtesting:
  timerange: "20210301-20260301"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 180

walk_forward:
  enabled: false

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "SOL/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 100
  max_drawdown: 0.15
  min_win_rate: 0.30
  timeframes: ["15m"]
  stoploss_range: [-0.05, -0.015]
  roi_range: [0.003, 0.025]
  max_open_trades_range: [1, 4]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'DONCHIAN'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'WILLR'
    - 'ROC'
    - 'AROON'
    - 'TEMA'
    - 'KAMA'
  min_per_strategy: 2
  max_per_strategy: 5

island_model:
  enabled: false

llm:
  enabled: false

terminal_monitor:
  enabled: true
