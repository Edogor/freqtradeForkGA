# ============================================================================
# E182: E170 + Strategy Culling (First Culling Infrastructure Test)
# ============================================================================
# Purpose: E170's winning recipe with the new strategy culling system enabled.
#          First live test of the culling infrastructure. Conservative rules:
#          - zero_trades: always remove (saves evaluation budget)
#          - negative_profit_high_fitness: remove fitness>0.35 but profit<-1%
#            (fights the fitness-profit disconnect observed in 8/15 experiments)
#          - min_trades_floor: remove strategies with <50 trades
#          Elite protection ON to ensure best strategies are never culled.
#
# Base: E178 (E170 corrected weights)
# Key changes: strategy_culling section enabled
# ============================================================================

genetic_algorithm:
  random_seed: null
  population_size: 10
  generations: 12
  mutation_rate: 0.18
  crossover_rate: 0.7
  elite_size: 2
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.1
  fitness_sharing: false
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'single_objective'

generic_island_model:
  enabled: true
  num_islands: 8
  population_per_island: 10
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5
    pair_rotation: false
  migration:
    topology: 'fully_connected'
    interval: 3
    count: 2
    merge_rounds: false

fitness_weights:
  profit: 0.18
  sharpe_ratio: 0.16
  sortino_ratio: 0.11
  profit_factor: 0.08
  drawdown: 0.12
  win_rate: 0.07
  trade_frequency: 0.20
  monthly_stability: 0.04
  cross_pair: 0.04

trade_frequency_thresholds:
  very_few: 40
  few: 120
  ideal_min: 240
  ideal_max: 800
  moderate_excess: 1200
  shape: 'asymmetric'

fitness_penalties:
  min_trades: 100
  min_trades_per_month: 20
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.25
  min_win_rate: 0.30
  complexity_weight: 0.01

strategy_culling:
  enabled: true
  protect_elites: true
  min_survivors: 4
  skip_first_generation: true
  rules:
    zero_trades:
      enabled: true
    negative_profit_high_fitness:
      enabled: true
      profit_threshold: -1.0
      min_fitness_for_cull: 0.35
    extreme_drawdown:
      enabled: false
      max_drawdown: 0.40
    min_trades_floor:
      enabled: true
      min_trades: 50
    validation_failure:
      enabled: false

backtesting:
  timerange: "20210301-20260301"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 180

walk_forward:
  enabled: false

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "SOL/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 100
  max_drawdown: 0.25
  min_win_rate: 0.30
  timeframes: ["15m"]
  stoploss_range: [-0.08, -0.02]
  roi_range: [0.005, 0.04]
  max_open_trades_range: [1, 5]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'DONCHIAN'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'WILLR'
    - 'ROC'
    - 'AROON'
    - 'TEMA'
    - 'KAMA'
  min_per_strategy: 2
  max_per_strategy: 5

island_model:
  enabled: false

llm:
  enabled: false

terminal_monitor:
  enabled: true
