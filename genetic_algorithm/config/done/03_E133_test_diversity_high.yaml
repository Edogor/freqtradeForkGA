genetic_algorithm:
  random_seed: 42
  population_size: 8
  generations: 15
  mutation_rate: 0.22
  crossover_rate: 0.7
  elite_size: 1
  tournament_size: 3
  selection_method: tournament
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.1
  fitness_sharing: false
  allow_self_crossover: false
  random_immigrants: 1
  mode: single_objective
fitness_weights:
  profit: 0.25
  sharpe_ratio: 0.2
  sortino_ratio: 0.15
  profit_factor: 0.1
  drawdown: 0.15
  win_rate: 0.08
  trade_frequency: 0.07
fitness_penalties:
  min_trades: 5
  max_drawdown: 0.25
  min_win_rate: 0.3
  complexity_weight: 0.01
backtesting:
  timerange: 20210301-20260301
  stake_amount: 100
  pairs:
  - BTC/USDT
  - ETH/USDT
  max_open_trades: 3
  fee: 0.001
  exchange: binance
  auto_download_data: true
  enable_cache: true
  timeout: 180
walk_forward:
  enabled: false
pair_validation:
  enabled: false
strategy_constraints:
  min_trades: 10
  max_drawdown: 0.25
  min_win_rate: 0.3
  timeframes:
  - 15m
  stoploss_range:
  - -0.15
  - -0.05
  roi_range:
  - 0.01
  - 0.08
  max_open_trades_range:
  - 1
  - 5
multi_timeframe:
  enabled: false
indicators:
  available:
  - RSI
  - MACD
  - BBANDS
  - EMA
  - SMA
  - SUPERTREND
  - PSAR
  - DONCHIAN
  - CMF
  - VROC
  min_per_strategy: 2
  max_per_strategy: 5
mutation:
  rate: 0.22
  add_indicator_prob: 0.15
  remove_indicator_prob: 0.1
  modify_param_prob: 0.35
  modify_condition_prob: 0.25
crossover:
  rate: 0.7
  indicator_mix_prob: 0.5
monte_carlo:
  enabled: false
generic_island_model:
  enabled: true
  num_islands: 5
  population_per_island: 8
  parallel_islands: false
  generations: 15
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5
    pair_rotation: false
  migration:
    topology: ring
    interval: 2
    count: 2
    merge_rounds: false
    tournament_size: 3
island_model:
  enabled: false
advanced:
  parallel_evaluation: false
  max_workers: 1
  enable_llm: true
  llm:
    enabled: true
    temperature: 0.7
    max_retries: 3
    timeout: 60
    min_call_interval: 3.0
    retry_delay: 5.0
    seed_ratio: 0.4
    immigrant_ratio: 0.5
    providers_list:
    - provider: anthropic
      model: claude-3-haiku-20240307
      api_key: ''
    - provider: groq
      model: llama-3.1-8b-instant
      api_key: ''
terminal_monitor:
  enabled: true
