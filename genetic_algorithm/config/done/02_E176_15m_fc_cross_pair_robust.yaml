# ============================================================================
# WAVE 21 — E176: FC + Cross-Pair Robustness Focus
# ============================================================================
# Purpose: Test whether emphasizing cross-pair consistency alongside profit
#          produces more robust strategies. Previous experiments showed high
#          win rates but negative profits, suggesting strategies exploit
#          pair-specific patterns. Boosting cross_pair (0.10) and
#          monthly_stability (0.10) weights forces the GA to find strategies
#          that generalize across all 5 pairs and produce stable monthly returns.
#
# Base: E170 (FC topology — produced 0.6319 outlier on island_4)
# Key changes: cross_pair=0.10 (default was 0.06), monthly_stability=0.10
#   (default was 0.06), profit=0.25, pop=12 (was 10), elite=3 (was 2)
# Expected: Lower peak fitness but more consistent profitability across pairs
# ============================================================================

genetic_algorithm:
  random_seed: null
  population_size: 12
  generations: 14
  mutation_rate: 0.18
  crossover_rate: 0.7
  elite_size: 3
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 10
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.1
  fitness_sharing: false
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'single_objective'

generic_island_model:
  enabled: true
  num_islands: 8
  population_per_island: 12
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5
    pair_rotation: false
  migration:
    topology: 'fully_connected'
    interval: 3
    count: 2
    merge_rounds: false

fitness_weights:
  profit: 0.25
  sharpe_ratio: 0.10
  sortino_ratio: 0.08
  profit_factor: 0.07
  drawdown: 0.10
  win_rate: 0.05
  trade_frequency: 0.10
  monthly_stability: 0.10
  cross_pair: 0.10
  drawdown_duration: 0.03
  consecutive_losses: 0.02

trade_frequency_thresholds:
  very_few: 40
  few: 120
  ideal_min: 240
  ideal_max: 800
  moderate_excess: 1200
  shape: 'asymmetric'

fitness_penalties:
  min_trades: 100
  min_trades_per_month: 20
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.25
  min_win_rate: 0.30
  complexity_weight: 0.01

backtesting:
  timerange: "20210301-20260301"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 180

walk_forward:
  enabled: false

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "SOL/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 100
  max_drawdown: 0.25
  min_win_rate: 0.30
  timeframes: ["15m"]
  stoploss_range: [-0.08, -0.02]
  roi_range: [0.005, 0.04]
  max_open_trades_range: [1, 5]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'DONCHIAN'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'WILLR'
    - 'ROC'
    - 'AROON'
    - 'TEMA'
    - 'KAMA'
  min_per_strategy: 2
  max_per_strategy: 5

island_model:
  enabled: false

llm:
  enabled: false

terminal_monitor:
  enabled: true
