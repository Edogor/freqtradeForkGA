# ============================================================================
# WAVE 20 — E166: NSGA-II Island Ring 15m — 3-Objective Pareto
# ============================================================================
# Purpose: Multi-objective optimization to find the Pareto front between
#          profit, risk-adjusted return, and drawdown control. Uses island
#          model with NSGA-II selection for diverse Pareto solutions.
#          Heavy trade_frequency weight ensures solutions are tradeable.
#
# Base: E100 (NSGA-II) + E138 (island ring) hybrid
# Key changes: NSGA-II mode, island ring, pair-split, no holdout,
#              high trade_frequency weight, 3 objectives
# ============================================================================

genetic_algorithm:
  random_seed: null
  population_size: 10
  generations: 14
  mutation_rate: 0.18
  crossover_rate: 0.75
  elite_size: 2
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.1
  fitness_sharing: false
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'nsga2'

nsga2:
  objectives:
    - name: 'profit'
      type: 'maximize'
      scale: 100.0
    - name: 'sharpe_ratio'
      type: 'maximize'
      scale: 3.0
    - name: 'max_drawdown'
      type: 'minimize'
      scale: 1.0
  pareto_front_size: 15
  crowding_distance_percentile: 0.1
  min_trades: 50

generic_island_model:
  enabled: true
  num_islands: 8
  population_per_island: 10
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false

fitness_weights:
  profit: 0.18
  sharpe_ratio: 0.16
  sortino_ratio: 0.10
  profit_factor: 0.08
  drawdown: 0.12
  win_rate: 0.06
  trade_frequency: 0.20
  consistency: 0.05
  exposure_time: 0.05

trade_frequency_thresholds:
  very_few: 20
  few: 60
  ideal_min: 120
  ideal_max: 600
  moderate_excess: 1000
  shape: 'asymmetric'

fitness_penalties:
  min_trades: 50
  min_trades_per_month: 10
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.25
  min_win_rate: 0.28
  complexity_weight: 0.01

backtesting:
  timerange: "20210301-20260301"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 180

walk_forward:
  enabled: false

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "SOL/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 50
  max_drawdown: 0.25
  min_win_rate: 0.28
  timeframes: ["15m"]
  stoploss_range: [-0.08, -0.02]
  roi_range: [0.005, 0.04]
  max_open_trades_range: [1, 5]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'DONCHIAN'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'WILLR'
    - 'ROC'
    - 'AROON'
    - 'TEMA'
    - 'KAMA'
  min_per_strategy: 2
  max_per_strategy: 5

island_model:
  enabled: false

llm:
  enabled: false

terminal_monitor:
  enabled: true
