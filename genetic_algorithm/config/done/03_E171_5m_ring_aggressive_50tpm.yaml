# ============================================================================
# WAVE 20 — E171: 5m Ring Aggressive Scalping — Soft 50tpm
# ============================================================================
# Purpose: Maximum scalping pressure. 5m timeframe + 50 trades/month = ~1.7
#          trades/day. Ultra-tight ROI (0.0015-0.012) forces micro-scalping.
#          Higher max_open_trades (5) and mutation rate (0.22) for aggressive
#          exploration. Tests the absolute upper bound of trade frequency
#          achievable with the GA on 5m data.
#
# Base: E163 (5m ring scalping)
# Key changes: 50tpm, ultra-tight ROI, higher mutation, higher max_open_trades
# ============================================================================

genetic_algorithm:
  random_seed: null
  population_size: 8
  generations: 14
  mutation_rate: 0.22
  crossover_rate: 0.65
  elite_size: 1
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 3.0
  adaptation_step: 0.12
  fitness_sharing: false
  allow_self_crossover: false
  random_immigrants: 2
  mode: 'single_objective'

generic_island_model:
  enabled: true
  num_islands: 10
  population_per_island: 8
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false

fitness_weights:
  profit: 0.14
  sharpe_ratio: 0.12
  sortino_ratio: 0.08
  profit_factor: 0.06
  drawdown: 0.13
  win_rate: 0.07
  trade_frequency: 0.28
  consistency: 0.06
  exposure_time: 0.06

trade_frequency_thresholds:
  very_few: 100
  few: 300
  ideal_min: 600
  ideal_max: 3000
  moderate_excess: 5000
  shape: 'asymmetric'

fitness_penalties:
  min_trades: 250
  min_trades_per_month: 50
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.25
  min_win_rate: 0.28
  complexity_weight: 0.01

backtesting:
  timerange: "20210301-20260301"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  max_open_trades: 5
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 300

walk_forward:
  enabled: false

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "SOL/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 250
  max_drawdown: 0.25
  min_win_rate: 0.28
  timeframes: ["5m"]
  stoploss_range: [-0.03, -0.005]
  roi_range: [0.0015, 0.012]
  max_open_trades_range: [3, 5]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'CCI'
    - 'WILLR'
    - 'ROC'
    - 'TEMA'
    - 'KAMA'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'AROON'
  min_per_strategy: 2
  max_per_strategy: 5

island_model:
  enabled: false

llm:
  enabled: false

terminal_monitor:
  enabled: true
