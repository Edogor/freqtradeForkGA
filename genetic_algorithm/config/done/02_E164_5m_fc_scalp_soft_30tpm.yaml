# ============================================================================
# WAVE 20 — E164: 5m FC Scalping + Soft 30tpm
# ============================================================================
# Purpose: Fully-connected topology on 5m scalping. FC had the highest
#          single-experiment fitness in trade-freq tests (E158=0.5560).
#          Tests if FC's faster convergence helps or hurts on 5m data.
#          30tpm is more aggressive than E163's 20tpm — pushes toward
#          genuine day-trading frequency.
#
# Base: E163 (5m scalping) + FC topology
# Key changes: topology=fully_connected, 30tpm, 8 islands, elite_size=2
# ============================================================================

genetic_algorithm:
  random_seed: null
  population_size: 10
  generations: 12
  mutation_rate: 0.18
  crossover_rate: 0.7
  elite_size: 2
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.1
  fitness_sharing: false
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'single_objective'

generic_island_model:
  enabled: true
  num_islands: 8
  population_per_island: 10
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5
    pair_rotation: false
  migration:
    topology: 'fully_connected'
    interval: 3
    count: 2
    merge_rounds: false

fitness_weights:
  profit: 0.17
  sharpe_ratio: 0.15
  sortino_ratio: 0.10
  profit_factor: 0.08
  drawdown: 0.12
  win_rate: 0.07
  trade_frequency: 0.22
  consistency: 0.05
  exposure_time: 0.04

trade_frequency_thresholds:
  very_few: 60
  few: 180
  ideal_min: 360
  ideal_max: 1500
  moderate_excess: 3000
  shape: 'asymmetric'

fitness_penalties:
  min_trades: 150
  min_trades_per_month: 30
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.22
  min_win_rate: 0.30
  complexity_weight: 0.01

backtesting:
  timerange: "20210301-20260301"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  max_open_trades: 5
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 300

walk_forward:
  enabled: false

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "SOL/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 150
  max_drawdown: 0.22
  min_win_rate: 0.30
  timeframes: ["5m"]
  stoploss_range: [-0.035, -0.007]
  roi_range: [0.002, 0.015]
  max_open_trades_range: [2, 5]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'CCI'
    - 'WILLR'
    - 'ROC'
    - 'TEMA'
    - 'KAMA'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'AROON'
  min_per_strategy: 2
  max_per_strategy: 5

island_model:
  enabled: false

llm:
  enabled: false

terminal_monitor:
  enabled: true
