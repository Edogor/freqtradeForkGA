# ============================================================================
# WAVE 20 — E165: 15m Ring + Tight ROI/SL (Intraday Fast-Exit)
# ============================================================================
# Purpose: Keep 15m timeframe but force scalping-style behavior through
#          very tight ROI targets (0.003-0.015) and tight stoploss (-0.04 to
#          -0.012). This should generate far more trades from 15m candles
#          by entering/exiting on smaller price movements (micro-scalping).
#          Different approach from E163 (5m) — same data, faster exits.
#
# Base: E160 (15m ring, soft 20tpm)
# Key changes: Tight ROI [0.003, 0.015], tight SL [-0.04, -0.012],
#              max_open_trades up to 5, higher exposure_time weight
# ============================================================================

genetic_algorithm:
  random_seed: null
  population_size: 8
  generations: 12
  mutation_rate: 0.18
  crossover_rate: 0.7
  elite_size: 1
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.1
  fitness_sharing: false
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'single_objective'

generic_island_model:
  enabled: true
  num_islands: 10
  population_per_island: 8
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false

fitness_weights:
  profit: 0.17
  sharpe_ratio: 0.15
  sortino_ratio: 0.10
  profit_factor: 0.08
  drawdown: 0.13
  win_rate: 0.08
  trade_frequency: 0.20
  consistency: 0.04
  exposure_time: 0.05

trade_frequency_thresholds:
  very_few: 40
  few: 120
  ideal_min: 240
  ideal_max: 1000
  moderate_excess: 2000
  shape: 'asymmetric'

fitness_penalties:
  min_trades: 100
  min_trades_per_month: 20
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.22
  min_win_rate: 0.30
  complexity_weight: 0.01

backtesting:
  timerange: "20210301-20260301"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  max_open_trades: 5
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 180

walk_forward:
  enabled: false

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "SOL/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 100
  max_drawdown: 0.22
  min_win_rate: 0.30
  timeframes: ["15m"]
  stoploss_range: [-0.04, -0.012]
  roi_range: [0.003, 0.015]
  max_open_trades_range: [2, 5]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'DONCHIAN'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'WILLR'
    - 'ROC'
    - 'AROON'
    - 'TEMA'
    - 'KAMA'
  min_per_strategy: 2
  max_per_strategy: 5

island_model:
  enabled: false

llm:
  enabled: false

terminal_monitor:
  enabled: true
