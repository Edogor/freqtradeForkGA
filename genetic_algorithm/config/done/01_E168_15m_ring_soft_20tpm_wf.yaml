# ============================================================================
# WAVE 20 — E168: 15m Ring + Soft 20tpm + Walk-Forward Validation
# ============================================================================
# Purpose: Apply walk-forward validation to the best-performing recipe
#          (E157-style ring + soft penalty). WF tests temporal consistency:
#          does the strategy work across different market regimes?
#          Uses harmonic_mean aggregation to penalize any failing window.
#
# Base: E160 (15m ring, soft 20tpm)
# Key changes: walk_forward enabled, harmonic_mean, rolling windows
# ============================================================================

genetic_algorithm:
  random_seed: null
  population_size: 8
  generations: 12
  mutation_rate: 0.18
  crossover_rate: 0.7
  elite_size: 1
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.1
  fitness_sharing: false
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'single_objective'

generic_island_model:
  enabled: true
  num_islands: 10
  population_per_island: 8
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false

fitness_weights:
  profit: 0.18
  sharpe_ratio: 0.16
  sortino_ratio: 0.11
  profit_factor: 0.08
  drawdown: 0.12
  win_rate: 0.07
  trade_frequency: 0.20
  consistency: 0.04
  exposure_time: 0.04

trade_frequency_thresholds:
  very_few: 40
  few: 120
  ideal_min: 240
  ideal_max: 800
  moderate_excess: 1200
  shape: 'asymmetric'

fitness_penalties:
  min_trades: 100
  min_trades_per_month: 20
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.25
  min_win_rate: 0.30
  complexity_weight: 0.01

backtesting:
  timerange: "20210301-20260301"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 180

walk_forward:
  enabled: true
  train_days: 60
  validation_days: 20
  step_days: 15
  mode: 'rolling'
  aggregation: 'harmonic_mean'
  min_train_trades: 5
  embargo_days: 5

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "SOL/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 100
  max_drawdown: 0.25
  min_win_rate: 0.30
  timeframes: ["15m"]
  stoploss_range: [-0.08, -0.02]
  roi_range: [0.005, 0.04]
  max_open_trades_range: [1, 5]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'DONCHIAN'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'WILLR'
    - 'ROC'
    - 'AROON'
    - 'TEMA'
    - 'KAMA'
  min_per_strategy: 2
  max_per_strategy: 5

island_model:
  enabled: false

llm:
  enabled: false

terminal_monitor:
  enabled: true
