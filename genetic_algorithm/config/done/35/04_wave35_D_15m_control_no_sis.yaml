# ============================================================================
# WAVE35 — D: 15m Control (SIS OFF) — A/B Baseline (Server)
# ============================================================================
# Hypothesis: Identical to wave35_C except SIS is disabled. This provides
#             a clean A/B comparison to measure the isolated effect of SIS
#             on island-model evolution with the latest infrastructure.
#
#             Previous SIS validation (V1 ctrl vs V3 SIS) showed +13.8% lift
#             but used different seeds and smaller configs. This A/B uses
#             the same population size, generations, islands, fitness weights,
#             and pairs — only SIS is toggled.
#
# SIS: Disabled — this is the control arm.
# Target: Server (24 CPU) · Island model · ~3-4 hrs
# ============================================================================

experiment_name: wave35_D_15m_control_no_sis

genetic_algorithm:
  population_size: 10
  generations: 15
  mutation_rate: 0.18
  crossover_rate: 0.70
  elite_size: 2
  tournament_size: 3
  selection_method: 'rank'
  convergence_patience: 12
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  mutation_cooldown_factor: 0.5
  fitness_sharing: true
  sharing_radius: 0.25
  random_immigrants: 1

backtesting:
  timerange: "20210301-20260301"
  timeframe: "15m"
  pairs: [BTC/USDT, ETH/USDT, SOL/USDT, XRP/USDT, BNB/USDT]
  max_open_trades: 2
  stake_amount: 0.15
  enable_cache: true
  auto_download_data: false

parallel_evaluation:
  enabled: true

generic_island_model:
  enabled: true
  num_islands: 8
  population_per_island: 10
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.40
  migration:
    topology: 'ring'
    interval: 3
    count: 2

fitness_weights:
  profit: 0.30
  sharpe_ratio: 0.16
  sortino_ratio: 0.10
  profit_factor: 0.08
  drawdown: 0.14
  win_rate: 0.08
  trade_frequency: 0.06
  monthly_stability: 0.04
  cross_pair: 0.04

fitness_penalties:
  min_trades: 50
  max_drawdown: 0.18
  min_win_rate: 0.35

fitness_bounds:
  profit_min: -15.0
  profit_max: 50.0

strategy_constraints:
  stoploss_range: [-0.10, -0.03]
  roi_range: [0.010, 0.06]
  max_open_trades_range: [1, 3]

holdout_validation:
  enabled: true
  holdout_pct: 0.15

holdout_monitoring:
  enabled: true
  interval: 3
  early_stop: true

deflated_sharpe:
  enabled: true

surrogate:
  enabled: true
  min_training_samples: 60
  filter_percentile: 70
  retrain_interval: 3
  model: "gradient_boosting"
  mutate_skipped: true

sis:
  enabled: false

terminal_monitor:
  enabled: true
  default_mode: simple
