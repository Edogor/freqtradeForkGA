# ============================================================================
# WAVE35 — E: 1h Island CCI Family Explorer (Server)
# ============================================================================
# Hypothesis: CCI has the highest individual enrichment (14.6x in top vs
#             bottom strategies). ADX+CCI synergy is 2.47x lift with 0.469
#             mean fitness. The global HoF #1 (fitness=0.793) uses
#             BBANDS+ADX+CCI on 1h. Yet recent waves never explored 1h
#             with island models.
#
#             This config uses 6 islands on 1h with indicator pools that
#             include CCI-adjacent indicators (CCI, ADX, ATR, RSI, BBANDS,
#             STOCH, ROC) — all with enrichment >1.4x per SIS.
#             Ring migration allows CCI-ADX combos from different islands to
#             cross-pollinate. Wider stoploss range matches HoF patterns.
#
# SIS: Enabled — indicator_weights will naturally boost CCI/ADX.
# Target: Server (24 CPU) · Island model · ~2-3 hrs (1h = 4× faster than 15m)
# ============================================================================

experiment_name: wave35_E_1h_island_cci_family

genetic_algorithm:
  population_size: 10
  generations: 20
  mutation_rate: 0.20
  crossover_rate: 0.75
  elite_size: 2
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 12
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  mutation_cooldown_factor: 0.5
  fitness_sharing: true
  sharing_radius: 0.22
  random_immigrants: 1

backtesting:
  timerange: "20210301-20260301"
  timeframe: "1h"
  pairs: [BTC/USDT, ETH/USDT, SOL/USDT, XRP/USDT]
  max_open_trades: 2
  stake_amount: 0.15
  enable_cache: true
  auto_download_data: false

parallel_evaluation:
  enabled: true

generic_island_model:
  enabled: true
  num_islands: 6
  population_per_island: 10
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.50
  migration:
    topology: 'ring'
    interval: 3
    count: 2

fitness_weights:
  profit: 0.28
  sharpe_ratio: 0.18
  sortino_ratio: 0.10
  profit_factor: 0.08
  drawdown: 0.15
  win_rate: 0.08
  trade_frequency: 0.05
  monthly_stability: 0.04
  cross_pair: 0.04

fitness_penalties:
  min_trades: 25
  max_drawdown: 0.20
  min_win_rate: 0.35

fitness_bounds:
  profit_min: -15.0
  profit_max: 50.0

strategy_constraints:
  stoploss_range: [-0.10, -0.03]
  roi_range: [0.015, 0.08]
  max_open_trades_range: [1, 3]

holdout_validation:
  enabled: true
  holdout_pct: 0.15

holdout_monitoring:
  enabled: true
  interval: 3
  early_stop: true

deflated_sharpe:
  enabled: true

surrogate:
  enabled: true
  min_training_samples: 50
  filter_percentile: 70
  retrain_interval: 3
  model: "gradient_boosting"

sis:
  enabled: true
  corpus_path: "genetic_algorithm/data/strategy_corpus.parquet"
  models_dir: "genetic_algorithm/ml/models"
  log_file: "genetic_algorithm/logs/sis_production/wave35_E_sis_events.jsonl"
  hooks:
    seed_filtering: true
    immigrants: true
    indicator_weights: true
    operator_weights: true
    synergy_weights: true
  immigrants_mode: "full"
  immigrants_per_generation: 2
  immigrants_max_fraction: 0.15

terminal_monitor:
  enabled: true
  default_mode: simple
