# ============================================================================
# WAVE 19 — E158: 1h + FC Topology + Trade Frequency Floor (SOFT)
# ============================================================================
# Purpose: Combine the two best findings from Wave 18:
#   1. 1h timeframe (E145: best=0.6013, fastest convergence)
#   2. FC topology (E139: best=0.5789, strongest 15m topology)
#   Plus soft trade frequency floor to fix E145's low trade count (14 trades).
#
# Hypothesis: FC topology's fast migration + 1h's fast eval + trade freq
#             pressure should produce high-fitness strategies with enough
#             trades for statistical significance.
#
# 10 islands × 10 pop × 12 gens = 1200 evals (fast on 1h)
# Pair split: Train on BTC/BNB/XRP, validate on ETH/SOL
# Expected runtime: ~1-2 hours
# ============================================================================

genetic_algorithm:
  random_seed: null
  population_size: 10
  generations: 12
  mutation_rate: 0.18
  crossover_rate: 0.7
  elite_size: 2
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.1
  fitness_sharing: false
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'single_objective'

generic_island_model:
  enabled: true
  num_islands: 10
  population_per_island: 10
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5
    pair_rotation: false
  migration:
    topology: 'fully_connected'
    interval: 3
    count: 2
    merge_rounds: false

fitness_weights:
  profit: 0.18
  sharpe_ratio: 0.16
  sortino_ratio: 0.11
  profit_factor: 0.08
  drawdown: 0.12
  win_rate: 0.07
  trade_frequency: 0.20
  consistency: 0.04
  exposure_time: 0.04

trade_frequency_thresholds:
  very_few: 10
  few: 30
  ideal_min: 60
  ideal_max: 300
  moderate_excess: 500
  shape: 'asymmetric'

fitness_penalties:
  min_trades: 20
  min_trades_per_month: 5
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.25
  min_win_rate: 0.30
  complexity_weight: 0.01

backtesting:
  timerange: "20210301-20260301"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 180

walk_forward:
  enabled: false

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "SOL/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 20
  max_drawdown: 0.25
  min_win_rate: 0.30
  timeframes: ["1h"]
  stoploss_range: [-0.15, -0.05]
  roi_range: [0.01, 0.10]
  max_open_trades_range: [1, 5]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'DONCHIAN'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'WILLR'
    - 'ROC'
    - 'AROON'
    - 'TEMA'
    - 'KAMA'
  min_per_strategy: 2
  max_per_strategy: 5

island_model:
  enabled: false

llm:
  enabled: false

terminal_monitor:
  enabled: true
