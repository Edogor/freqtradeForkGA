# ============================================================================
# SIS Comparison v2 — CTRL: No SIS (pure GA baseline)
# ============================================================================
# v2 changes vs v1:
#   - 20 generations (was 15) for stronger convergence signal
#   - Updated output paths to v2 subdirectory
# random_seed: 42 — identical to exp_with_sis_v2.yaml for fair comparison
# ============================================================================

experiment_name: sis_v2_ctrl_no_sis

genetic_algorithm:
  random_seed: 42
  population_size: 12
  generations: 20
  mutation_rate: 0.18
  crossover_rate: 0.7
  elite_size: 2
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.1
  mutation_cooldown_factor: 0.5
  fitness_sharing: false
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'single_objective'

surrogate:
  enabled: true
  min_training_samples: 30
  filter_percentile: 60
  retrain_interval: 3
  model: "gradient_boosting"
  mutate_skipped: true

generic_island_model:
  enabled: true
  num_islands: 4
  population_per_island: 12
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false

fitness_weights:
  profit: 0.18
  sharpe_ratio: 0.16
  sortino_ratio: 0.11
  profit_factor: 0.08
  drawdown: 0.12
  win_rate: 0.07
  trade_frequency: 0.20
  monthly_stability: 0.04
  cross_pair: 0.04

trade_frequency_thresholds:
  auto_scale_by_timeframe: true
  shape: 'asymmetric'

fitness_penalties:
  min_trades: 50
  min_trades_per_month: 10
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.25
  min_win_rate: 0.30
  complexity_weight: 0.01

backtesting:
  timerange: "20240301-20260228"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "ETH/USDT"
    - "XRP/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 180
  timeframes:
    - "15m"

walk_forward:
  enabled: false
  preset: intraday
  mode: 'rolling'
  aggregation: 'harmonic_mean'
  embargo_days: 3
  min_train_trades: 8
  max_windows: 10
  gap_penalty:
    enabled: true
    threshold: 0.1
    max_penalty: 0.5

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "XRP/USDT"
  weight_train: 0.65
  weight_val: 0.35
  min_val_fitness: 0.0
  validate_top_n_only: 5

holdout_validation:
  enabled: false
  holdout_pct: 0.15

holdout_monitoring:
  enabled: false
  interval: 3
  top_n: 3
  early_stop: true
  early_stop_threshold: 0.60
  early_stop_checks: 3
  fitness_penalty: true
  penalty_factor: 0.8

monte_carlo:
  enabled: false
  num_permutations: 15
  methods:
    - bootstrap
    - shuffle
    - slippage_jitter
  slippage_std: 0.0005

strategy_constraints:
  min_trades: 50
  max_drawdown: 0.25
  min_win_rate: 0.30
  timeframes: ["15m", "1h"]
  stoploss_range: [-0.08, -0.02]
  roi_range: [0.005, 0.04]
  max_open_trades_range: [1, 5]
  trailing_stop_positive_range: [0.005, 0.02]
  trailing_stop_offset_addition_range: [0.005, 0.015]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'DONCHIAN'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'WILLR'
    - 'ROC'
    - 'AROON'
    - 'TEMA'
    - 'KAMA'
    - 'CCI'
    - 'ATR'
    - 'STOCH'
  min_per_strategy: 2
  max_per_strategy: 4

storage:
  database: "genetic_algorithm/data/sis_comparison/v2/ctrl.db"
  strategy_dir: "user_data/strategies/sis_v2_ctrl"
  checkpoint_dir: "genetic_algorithm/data/sis_comparison/v2/ctrl_checkpoints"
  checkpoint_interval: 5
  keep_history: true
  min_disk_gb: 2.0
  min_disk_gb_runtime: 2.0
  max_cache_disk_mb: 3000

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/sis_comparison/v2/ctrl.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: true
  update_interval: 1
  output_dir: "genetic_algorithm/output/sis_comparison/v2/ctrl/plots"

terminal_monitor:
  enabled: true
  default_mode: "simple"

hall_of_fame:
  enabled: true
  max_size: 30
  inject_count: 2
  min_fitness: 0.10
  directory: "genetic_algorithm/data/sis_comparison/v2/ctrl_hof"

deflated_sharpe:
  enabled: true
  min_trades: 10
  benchmark_sr: 0.0
  skewness_correction: true

advanced:
  parallel_evaluation: true
  max_workers: 6
  enable_dry_run: false
  enable_ml_fitness: false

  llm:
    enabled: false
    provider: "groq"
    api_key: ""
    model: "llama-3.3-70b-versatile"
    temperature: 0.7
    max_retries: 3
    timeout: 60
    seed_ratio: 0.20
    immigrants_per_generation: 2
    immigrant_ratio: 0.50
    batch_enabled: true
    max_batch_size: 5
    max_calls_per_generation: 15
    max_calls_per_run: 400

island_model:
  enabled: false

sis:
  enabled: false
