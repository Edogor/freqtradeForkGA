# ============================================================================
# FAST EVOLUTION DEMO — Optimized for Speed + Visible Per-Generation Progress
# ============================================================================
# Based on: E49 (5/5 SAFE, 85% MC robustness) — the best proven config
# Optimized for: Maximum speed with parallel workers, visible fitness climb
#
# Speed optimizations applied:
#   - parallel_evaluation: 6 workers (12 CPU / 2 per worker)
#   - Single pair (BTC/USDT) — fastest backtest
#   - No walk-forward (saves 5x runtime)
#   - No Monte Carlo (saves ~2 min per gen)
#   - Holdout monitoring ON for live overfitting feedback
#   - 15m timeframe (fast backtests, proven profitable)
#   - Tight timerange: 2 years (fast backtests, enough data)
#   - enable_cache: true (2-5x speedup on repeated evaluations)
#
# Expected runtime: ~10-15 minutes for 15 generations
# Expected behavior: Visible fitness improvement generations 1-8, plateau 8-15
# ============================================================================

genetic_algorithm:
  random_seed: null                # Different results each run
  population_size: 15              # Proven sweet spot (E49/E51/E63 all used 15)
  generations: 15                  # Enough for convergence + a few plateau gens
  max_runtime_minutes: 30          # Safety cap
  mutation_rate: 0.20              # E49 sweet spot — best exploration/exploitation
  crossover_rate: 0.80             # E49 value
  crossover_method: 'uniform'      # Best diversity (proven)
  elite_size: 2                    # E49 value — preserves best without stagnation
  tournament_size: 3               # Strong selection pressure → visible improvement
  selection_method: 'tournament'   # Most stable (E63 W9 champion used this)
  convergence_patience: 10         # Allow some plateau before stopping
  adaptive_mutation: true          # Auto-escalate when stuck
  max_adaptation_factor: 2.0
  adaptation_step: 0.10
  max_mutation_rate: 0.35
  fitness_sharing: true            # Maintain diversity
  sharing_radius: 0.25
  diversity_threshold: 0.15
  allow_self_crossover: false
  random_immigrants: 2             # Fresh genetic material each generation
  mode: 'single_objective'

fitness_weights:
  profit: 0.30                     # Slightly more profit-oriented for visible gains
  sharpe_ratio: 0.18
  sortino_ratio: 0.12
  profit_factor: 0.10
  drawdown: 0.15
  win_rate: 0.05
  trade_frequency: 0.04
  monthly_stability: 0.06

fitness_penalties:
  min_trades: 15
  max_drawdown: 0.25              # Slightly relaxed for faster discovery
  min_win_rate: 0.30
  complexity_weight: 0.015
  unused_indicator_weight: 0.020

backtesting:
  timerange: "20240301-20260301"   # 2 years — fast backtests, recent market
  stake_amount: 100
  pairs:
    - "BTC/USDT"                   # Single pair = fastest
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: false        # Data already verified present
  enable_cache: true               # Critical: 2-5x speedup
  timeout: 120

# === SPEED: No walk-forward (saves 5x runtime) ===
walk_forward:
  enabled: false

# === Holdout ON for overfitting signal (cheap, ~1 extra backtest) ===
holdout_validation:
  enabled: true
  holdout_pct: 0.15

holdout_monitoring:
  enabled: true
  interval: 3                      # Check every 3 gens (cheap)
  top_n: 3
  early_stop: true
  early_stop_threshold: 0.55
  early_stop_checks: 3
  trend_early_stop: true
  trend_checks: 3
  fitness_penalty: true
  penalty_factor: 0.70

regime_aware:
  enabled: false

monte_carlo:
  enabled: false                   # Saves time — run post-hoc on best if needed

deflated_sharpe:
  enabled: true                    # Cheap, prevents Sharpe gaming
  min_trades: 10
  benchmark_sr: 0.0
  skewness_correction: true

parsimony:
  enabled: true                    # Keep strategies simple → faster backtests
  max_indicators: 4
  max_conditions: 5

cpcv:
  enabled: false

strategy_constraints:
  min_trades: 15
  max_drawdown: 0.25
  min_win_rate: 0.30
  timeframes: ["15m"]
  stoploss_range: [-0.10, -0.03]
  roi_range: [0.01, 0.08]
  max_open_trades_range: [1, 3]
  min_exit_conditions: 1

multi_timeframe:
  enabled: false

indicators:
  available:
    - "RSI"
    - "EMA"
    - "BBANDS"
    - "ADX"
    - "MACD"
    - "SMA"
    - "SUPERTREND"
    - "STOCH"
    - "ATR"
    - "CCI"
  max_per_strategy: 4
  min_per_strategy: 2
  min_entry_conditions: 2

  RSI:
    period: [7, 21]
    buy_threshold: [22, 35]
    sell_threshold: [65, 80]
  MACD:
    fast_period: [8, 18]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [14, 30]
    std_dev: [1.8, 2.8]
  EMA:
    period: [8, 40]
  SMA:
    period: [15, 80]
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [18, 35]
    d_threshold: [65, 82]
  SUPERTREND:
    period: [7, 14]
    multiplier: [2.0, 4.0]

trade_visualization:
  enabled: false

terminal_monitor:
  enabled: true                    # Live terminal progress

parallel_evaluation:
  enabled: true                    # KEY: 6 workers on 12-CPU machine
  num_workers: 6
  worker_log_level: 'WARNING'
  backtest_timeout: 120

output:
  dir: 'genetic_algorithm/output/fast_demo'
  save_stats: true
  stats_file: 'evolution_stats.json'
  save_snapshots: true
  snapshot_interval: 1

storage:
  database: "genetic_algorithm/data/fast_demo.db"
  strategy_dir: "user_data/strategies/fast_demo"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_fast_demo"
  checkpoint_interval: 3
  keep_history: true

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/fast_demo.log"
  console: true

hall_of_fame:
  enabled: true
  max_size: 20
  inject_count: 2
  min_fitness: 0.05
  directory: "genetic_algorithm/data/hall_of_fame_fast_demo"

advanced:
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: false
  llm:
    enabled: false

overfit_analysis:
  thresholds:
    holdout_degradation_warning: 0.25
    holdout_degradation_overfit: 0.45
