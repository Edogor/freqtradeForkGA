# Island + LLM Config C3 — 5 Islands, Ring Topology, Anthropic
#
# Purpose: Test island model with LLM-generated immigrants using Anthropic
#          as primary provider. Ring migration topology with conservative
#          migration pressure to preserve island diversity.
#
# Architecture:
#   5 islands × 5 pop each = 25 individuals total
#   Ring migration: island[i] → island[(i+1) % 5] every 3 gens, count=1
#   LLM: 40% seed ratio, 50% immigrant ratio (Anthropic primary)
#   AP-1: elite=1 per island, AP-6: pop ≤ 6 per island
#
# Window: 5 years (2021-03 to 2026-03), timeframe 15m
# Expected runtime: ~6–10 hours (5 islands × 15 gens)

genetic_algorithm:
  random_seed: null
  population_size: 5         # Per-island pop (AP-6: ≤ 6)
  generations: 15
  mutation_rate: 0.18
  crossover_rate: 0.7
  elite_size: 1              # AP-1: elite = 1 for island pop ≤ 6
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 8

  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.1

  fitness_sharing: false     # Fitness sharing + island model = unstable (KNOWN_ISSUES)
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'single_objective'

fitness_weights:
  profit: 0.25
  sharpe_ratio: 0.20
  sortino_ratio: 0.15
  profit_factor: 0.10
  drawdown: 0.15
  win_rate: 0.08
  trade_frequency: 0.07

fitness_penalties:
  min_trades: 5
  max_drawdown: 0.25
  min_win_rate: 0.30
  complexity_weight: 0.01

backtesting:
  timerange: "20210301-20260301"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 180

walk_forward:
  enabled: false

pair_validation:
  enabled: false

strategy_constraints:
  min_trades: 10
  max_drawdown: 0.25
  min_win_rate: 0.30
  timeframes: ["15m"]
  stoploss_range: [-0.15, -0.05]
  roi_range: [0.01, 0.08]
  max_open_trades_range: [1, 5]

multi_timeframe:
  enabled: false

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'DONCHIAN'
    - 'CMF'
    - 'VROC'
  min_per_strategy: 2
  max_per_strategy: 5

mutation:
  rate: 0.18
  add_indicator_prob: 0.15
  remove_indicator_prob: 0.10
  modify_param_prob: 0.35
  modify_condition_prob: 0.25

crossover:
  rate: 0.7
  indicator_mix_prob: 0.5

monte_carlo:
  enabled: false

# === Generic Island Model ===
generic_island_model:
  enabled: true
  num_islands: 5
  population_per_island: 5   # AP-6: ≤ 6
  parallel_islands: false
  generations: 15
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5   # 50% overlap between indicator pools
    pair_rotation: false
  migration:
    topology: 'ring'         # Proven stable, conservative flow
    interval: 3              # Migrate every 3 gens
    count: 1                 # 1 individual per migration (conservative)
    merge_rounds: false
    tournament_size: 3

island_model:
  enabled: false

# === LLM Integration ===
advanced:
  parallel_evaluation: false
  max_workers: 1
  enable_llm: true

  llm:
    enabled: true
    temperature: 0.7
    max_retries: 3
    timeout: 60
    min_call_interval: 3.0
    retry_delay: 5.0

    seed_ratio: 0.4          # 40% of initial pop from LLM
    immigrant_ratio: 0.5     # 50% of immigrants from LLM

    providers_list:
      - provider: anthropic
        model: claude-3-5-haiku-20241022
        api_key: ""           # Uses ANTHROPIC_API_KEY from .env
      - provider: groq
        model: llama-3.1-8b-instant
        api_key: ""           # Fallback: GROQ_API_KEY from .env

terminal_monitor:
  enabled: true
