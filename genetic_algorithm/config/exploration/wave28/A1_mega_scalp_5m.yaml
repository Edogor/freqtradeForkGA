# ============================================================================
# WAVE28 — A1: Mega Scalp 5m (Large Island Production Run)
# ============================================================================
# 20 islands × 50 pop = 1000 individuals, fully_connected + merge rounds
# Optimized for WIN/LOSS RATIO + short-term scalping gains
# Pair validation: 3 train / 3 validation, no walk-forward
# 5+ year timerange (2021-2026) for regime diversity
# 5 parallel workers on 6-core i5-9500T (~83% CPU)
# Expected runtime: ~4-7 days
#
# v2 changes: fully_connected topology + merge rounds, gradient_boosting
#   surrogate, filter_percentile 70, gaussian trade freq, sharing_radius 0.30,
#   convergence_patience 30, inject_count 5, timeout 300
# ============================================================================

experiment_name: wave28_A1_mega_scalp_5m

genetic_algorithm:
  random_seed: null
  population_size: 50
  generations: 50
  mutation_rate: 0.18
  crossover_rate: 0.7
  elite_size: 3
  tournament_size: 4
  selection_method: 'tournament'
  convergence_patience: 30
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.12
  mutation_cooldown_factor: 0.5
  fitness_sharing: true
  sharing_radius: 0.30
  diversity_threshold: 0.12
  allow_self_crossover: false
  random_immigrants: 3
  mode: 'single_objective'

surrogate:
  enabled: true
  min_training_samples: 100
  filter_percentile: 70
  retrain_interval: 3
  model: "gradient_boosting"
  mutate_skipped: true

generic_island_model:
  enabled: true
  num_islands: 20
  population_per_island: 50
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.4
    pair_rotation: false
  migration:
    topology: 'fully_connected'
    interval: 5
    count: 1
    merge_rounds: true
    merge_interval: 10

# ── Fitness Weights (W/L ratio emphasis) ──────────────────────────────────
# win_rate boosted to 0.17 (from C4's 0.08) for optimal W/L ratio
# trade_frequency at 0.21 to reward frequent short-term scalping
# profit reduced to 0.10 — we gather many small wins, not big swings
fitness_weights:
  profit: 0.10
  sharpe_ratio: 0.15
  sortino_ratio: 0.09
  profit_factor: 0.07
  drawdown: 0.13
  win_rate: 0.17
  trade_frequency: 0.21
  consistency: 0.04
  exposure_time: 0.04

trade_frequency_thresholds:
  auto_scale_by_timeframe: true
  shape: 'gaussian'

# ── Penalties (tighter than C4 for quality scalping) ──────────────────────
fitness_penalties:
  min_trades: 300
  min_trades_per_month: 50
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.15
  min_win_rate: 0.40
  complexity_weight: 0.01

backtesting:
  timerange: "20210101-20260331"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "PEPE/USDT"
  max_open_trades: 3
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 300

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "XRP/USDT"
    - "PEPE/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0
  validate_top_n_only: 8

walk_forward:
  enabled: false
  preset: scalping

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

# ── Strategy Constraints (tight scalping ranges) ─────────────────────────
strategy_constraints:
  min_trades: 300
  max_drawdown: 0.15
  min_win_rate: 0.40
  timeframes: ["5m"]
  stoploss_range: [-0.035, -0.008]
  roi_range: [0.003, 0.018]
  max_open_trades_range: [1, 4]
  trailing_stop_positive_range: [0.003, 0.012]
  trailing_stop_offset_addition_range: [0.003, 0.01]

# ── 18 Indicators (expanded for 20-island pool specialization) ───────────
indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'ROC'
    - 'TEMA'
    - 'KAMA'
    - 'VWAP'
    - 'STOCH'
    - 'DONCHIAN'
    - 'WILLR'
    - 'AROON'
  min_per_strategy: 2
  max_per_strategy: 4

storage:
  database: "genetic_algorithm/data/wave28_A1.db"
  strategy_dir: "user_data/strategies/wave28_A1"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave28_A1"
  checkpoint_interval: 3
  keep_history: true
  min_disk_gb: 5.0
  min_disk_gb_runtime: 2.0
  max_cache_disk_mb: 8000

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave28_A1.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: true
  update_interval: 1
  output_dir: "genetic_algorithm/output/exploration/wave28/A1_mega_scalp_5m/plots"

terminal_monitor:
  enabled: true
  default_mode: "simple"

hall_of_fame:
  enabled: true
  max_size: 100
  inject_count: 5
  min_fitness: 0.12
  directory: "genetic_algorithm/data/hall_of_fame_wave28_A1"

deflated_sharpe:
  enabled: true
  min_trades: 20
  benchmark_sr: 0.0
  skewness_correction: true

parallel_evaluation:
  enabled: true
  num_workers: 4
  backtest_timeout: 300

advanced:
  parallel_evaluation: true
  max_workers: 5
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: false

island_model:
  enabled: false
