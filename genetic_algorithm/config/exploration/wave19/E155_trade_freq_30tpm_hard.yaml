# ============================================================================
# WAVE 19 — E155: Trade Frequency Floor — 30 trades/month (hard kill)
# ============================================================================
# Purpose: Day-trading territory. 30 trades/month minimum.
#          Strategies below threshold get fitness=0 (hard penalty).
#          Pushes evolution toward strategies that generate ~1 trade/day.
#
# Base: E138 (ring topology, 10×8 islands, pair-split)
# Key changes: min_trades_per_month=30, ideal_min=360, tighter ROI/SL
# ============================================================================

genetic_algorithm:
  random_seed: null
  population_size: 8
  generations: 12
  mutation_rate: 0.18
  crossover_rate: 0.7
  elite_size: 1
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.1
  fitness_sharing: false
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'single_objective'

generic_island_model:
  enabled: true
  num_islands: 10
  population_per_island: 8
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false

fitness_weights:
  profit: 0.22
  sharpe_ratio: 0.18
  sortino_ratio: 0.13
  profit_factor: 0.10
  drawdown: 0.13
  win_rate: 0.08
  trade_frequency: 0.12
  consistency: 0.04

trade_frequency_thresholds:
  very_few: 60
  few: 180
  ideal_min: 360
  ideal_max: 1500
  moderate_excess: 2400
  shape: 'asymmetric'

fitness_penalties:
  min_trades: 150
  min_trades_per_month: 30
  min_trades_per_month_penalty: 0.0
  max_drawdown: 0.25
  min_win_rate: 0.30
  complexity_weight: 0.01

backtesting:
  timerange: "20210301-20260301"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 180

walk_forward:
  enabled: false

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "SOL/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 150
  max_drawdown: 0.25
  min_win_rate: 0.30
  timeframes: ["15m"]
  stoploss_range: [-0.08, -0.02]
  roi_range: [0.005, 0.04]
  max_open_trades_range: [1, 5]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'DONCHIAN'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'WILLR'
    - 'ROC'
    - 'AROON'
    - 'TEMA'
    - 'KAMA'
  min_per_strategy: 2
  max_per_strategy: 5

island_model:
  enabled: false

llm:
  enabled: false

terminal_monitor:
  enabled: true
