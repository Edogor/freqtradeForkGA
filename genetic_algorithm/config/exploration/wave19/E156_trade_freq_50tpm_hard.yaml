# ============================================================================
# WAVE 19 — E156: Trade Frequency Floor — 50 trades/month (hard kill)
# ============================================================================
# Purpose: High-frequency experiment. 50 trades/month = ~1.7 trades/day.
#          Strategies below threshold get fitness=0 (hard penalty).
#          Maximum trade_frequency weight (0.15) to heavily reward active trading.
#
# Base: E138 (ring topology, 10×8 islands, pair-split)
# Key changes: min_trades_per_month=50, ideal_min=600, trade_freq weight=0.15
# ============================================================================

genetic_algorithm:
  random_seed: null
  population_size: 8
  generations: 12
  mutation_rate: 0.18
  crossover_rate: 0.7
  elite_size: 1
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.1
  fitness_sharing: false
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'single_objective'

generic_island_model:
  enabled: true
  num_islands: 10
  population_per_island: 8
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false

fitness_weights:
  profit: 0.20
  sharpe_ratio: 0.17
  sortino_ratio: 0.12
  profit_factor: 0.09
  drawdown: 0.12
  win_rate: 0.08
  trade_frequency: 0.15
  consistency: 0.04
  exposure_time: 0.03

trade_frequency_thresholds:
  very_few: 100
  few: 300
  ideal_min: 600
  ideal_max: 2500
  moderate_excess: 4000
  shape: 'asymmetric'

fitness_penalties:
  min_trades: 250
  min_trades_per_month: 50
  min_trades_per_month_penalty: 0.0
  max_drawdown: 0.30
  min_win_rate: 0.28
  complexity_weight: 0.01

backtesting:
  timerange: "20210301-20260301"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  max_open_trades: 5
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 240

walk_forward:
  enabled: false

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "SOL/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 250
  max_drawdown: 0.30
  min_win_rate: 0.28
  timeframes: ["15m"]
  stoploss_range: [-0.06, -0.015]
  roi_range: [0.003, 0.03]
  max_open_trades_range: [2, 6]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'DONCHIAN'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'WILLR'
    - 'ROC'
    - 'AROON'
    - 'TEMA'
    - 'KAMA'
  min_per_strategy: 2
  max_per_strategy: 5

island_model:
  enabled: false

llm:
  enabled: false

terminal_monitor:
  enabled: true
