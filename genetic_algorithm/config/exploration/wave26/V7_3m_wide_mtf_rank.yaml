# ============================================================================
# WAVE26 — V7: 3m Rank + Wide Multi-TF (5m/15m/1h/4h)
# ============================================================================
# 3m base with 4 informative TFs — maximum multi-TF context
# Rank selection + high diversity pressure for broad exploration
# Tests whether more TF context compensates for added complexity
# ============================================================================

experiment_name: wave26_V7_3m_wide_mtf_rank

genetic_algorithm:
  random_seed: null
  population_size: 30
  generations: 50
  mutation_rate: 0.20
  crossover_rate: 0.7
  elite_size: 3
  tournament_size: 4
  selection_method: 'rank'
  convergence_patience: 15
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.12
  mutation_cooldown_factor: 0.5
  fitness_sharing: true
  sharing_radius: 0.22
  diversity_threshold: 0.14
  allow_self_crossover: false
  random_immigrants: 4
  mode: 'single_objective'

surrogate:
  enabled: true
  min_training_samples: 80
  filter_percentile: 55
  retrain_interval: 3
  model: "random_forest"
  mutate_skipped: true

generic_island_model:
  enabled: true
  num_islands: 10
  population_per_island: 30
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 4
    count: 2
    merge_rounds: false

fitness_weights:
  profit: 0.14
  sharpe_ratio: 0.16
  sortino_ratio: 0.10
  profit_factor: 0.10
  drawdown: 0.12
  win_rate: 0.08
  trade_frequency: 0.22
  consistency: 0.04
  exposure_time: 0.04

trade_frequency_thresholds:
  auto_scale_by_timeframe: true
  shape: 'asymmetric'

fitness_penalties:
  min_trades: 350
  min_trades_per_month: 60
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.20
  min_win_rate: 0.34
  complexity_weight: 0.012

backtesting:
  timerange: "20240101-20260327"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "PEPE/USDT"
  max_open_trades: 3
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 480

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "XRP/USDT"
    - "PEPE/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0
  validate_top_n_only: 5

walk_forward:
  enabled: false
  preset: scalping

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 350
  max_drawdown: 0.20
  min_win_rate: 0.34
  timeframes: ["3m"]
  stoploss_range: [-0.035, -0.008]
  roi_range: [0.0015, 0.018]
  max_open_trades_range: [1, 5]

multi_timeframe:
  enabled: true
  available: ['5m', '15m', '1h', '4h']
  max_timeframes: 4
  higher_timeframe_preference:
    - 'EMA'
    - 'SMA'
    - 'RSI'
    - 'ATR'
    - 'ADX'
    - 'BBANDS'
    - 'SUPERTREND'

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'ROC'
    - 'TEMA'
    - 'KAMA'
    - 'VWAP'
    - 'STOCH'
    - 'DONCHIAN'
    - 'AROON'
  min_per_strategy: 2
  max_per_strategy: 5

storage:
  database: "genetic_algorithm/data/wave26_V7.db"
  strategy_dir: "user_data/strategies/wave26_V7"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave26_V7"
  checkpoint_interval: 3
  keep_history: true
  min_disk_gb: 5.0
  min_disk_gb_runtime: 2.0
  max_cache_disk_mb: 5000

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave26_V7.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: true
  update_interval: 1
  output_dir: "genetic_algorithm/output/exploration/wave26/V7_3m_wide_mtf_rank/plots"

terminal_monitor:
  enabled: true
  default_mode: "simple"

hall_of_fame:
  enabled: true
  max_size: 50
  inject_count: 2
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_wave26_V7"

deflated_sharpe:
  enabled: true
  min_trades: 25
  benchmark_sr: 0.0
  skewness_correction: true

advanced:
  parallel_evaluation: true
  max_workers: 5
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: false

island_model:
  enabled: false
