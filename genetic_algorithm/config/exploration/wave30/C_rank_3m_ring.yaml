# ============================================================================
# WAVE30 — C: 3-Minute Micro Scalp (Ring Topology)
# ============================================================================
# Hypothesis: 3m offers more trade opportunities for pure frequency scalping
# 6 islands × 15 pop = 90 individuals, ring topology
# Single 3m TF — fastest timeframe tested at scale
# Pair validation: 2 train + 2 val
# Sequential per island (no parallel workers)
# ============================================================================

experiment_name: wave30_C_rank_3m_ring

genetic_algorithm:
  random_seed: null
  population_size: 15
  generations: 25
  mutation_rate: 0.18
  crossover_rate: 0.7
  elite_size: 3
  tournament_size: 3
  selection_method: 'rank'
  convergence_patience: 15
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.12
  mutation_cooldown_factor: 0.5
  fitness_sharing: true
  sharing_radius: 0.22
  diversity_threshold: 0.12
  allow_self_crossover: false
  random_immigrants: 2
  mode: 'single_objective'

surrogate:
  enabled: true
  min_training_samples: 80
  filter_percentile: 70
  retrain_interval: 3
  model: "gradient_boosting"
  mutate_skipped: true

generic_island_model:
  enabled: true
  num_islands: 6
  population_per_island: 15
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.4
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false

# ── Fitness Weights (frequency-king scalping) ─────────────────────────────
fitness_weights:
  profit: 0.08
  sharpe_ratio: 0.14
  sortino_ratio: 0.08
  profit_factor: 0.06
  drawdown: 0.12
  win_rate: 0.20
  trade_frequency: 0.24
  monthly_stability: 0.04
  cross_pair: 0.04

trade_frequency_thresholds:
  auto_scale_by_timeframe: true
  shape: 'gaussian'

fitness_penalties:
  min_trades: 200
  min_trades_per_month: 35
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.15
  min_win_rate: 0.40
  complexity_weight: 0.01

backtesting:
  timerange: "20210101-20260331"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "SOL/USDT"
    - "ETH/USDT"
    - "BNB/USDT"
  max_open_trades: 3
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 300

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "SOL/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "BNB/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0
  validate_top_n_only: 8

walk_forward:
  enabled: false

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 200
  max_drawdown: 0.15
  min_win_rate: 0.40
  timeframes: ["3m"]
  stoploss_range: [-0.025, -0.005]
  roi_range: [0.002, 0.012]
  max_open_trades_range: [1, 4]
  trailing_stop_positive_range: [0.002, 0.008]
  trailing_stop_offset_addition_range: [0.002, 0.006]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'ROC'
    - 'TEMA'
    - 'KAMA'
    - 'VWAP'
    - 'STOCH'
    - 'DONCHIAN'
    - 'WILLR'
    - 'AROON'
  min_per_strategy: 2
  max_per_strategy: 4

storage:
  database: "genetic_algorithm/data/wave30_C.db"
  strategy_dir: "user_data/strategies/wave30_C"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave30_C"
  checkpoint_interval: 3
  keep_history: true
  min_disk_gb: 5.0
  min_disk_gb_runtime: 2.0
  max_cache_disk_mb: 8000

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave30_C.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: true
  update_interval: 1
  output_dir: "genetic_algorithm/output/exploration/wave30/C_rank_3m_ring/plots"

terminal_monitor:
  enabled: true
  default_mode: "simple"

hall_of_fame:
  enabled: true
  max_size: 50
  inject_count: 3
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_wave30_C"

deflated_sharpe:
  enabled: true
