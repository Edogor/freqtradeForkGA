# ============================================================================
# WAVE31 — C: Plain GA 15m NSGA-II Pareto (3-Objective)
# ============================================================================
# Hypothesis: Pareto multi-objective evolution finds better trade-off between
#             profit, win_rate, and drawdown than weighted-sum single-obj.
#             No island model — plain GA with larger population.
#             Objectives: maximize profit, maximize win_rate, minimize drawdown.
#
# Key design:
#   - mode: nsga2 (Pareto front evolution)
#   - fitness_sharing: false (REQUIRED for NSGA-II — conflicts with crowding)
#   - pop=30 (non-island, larger for diverse Pareto front)
#   - pareto_front_size: 20 (rich front for cross-pair filtering)
#   - 15m timeframe
# Pair validation: 2 train (BTC+SOL) + 2 val (ETH+BNB)
# ============================================================================

experiment_name: wave31_C_plain_15m_nsga2_3obj

genetic_algorithm:
  random_seed: null
  population_size: 30
  generations: 30
  mutation_rate: 0.20
  crossover_rate: 0.72
  elite_size: 3
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 15
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.12
  mutation_cooldown_factor: 0.5
  fitness_sharing: false          # CRITICAL: must be OFF for NSGA-II
  allow_self_crossover: false
  random_immigrants: 2
  mode: 'nsga2'

# ── NSGA-II Pareto Objectives ─────────────────────────────────────────────
nsga2:
  objectives:
    - name: 'profit'
      type: 'maximize'
      scale: 100.0
    - name: 'win_rate'
      type: 'maximize'
      scale: 1.0
    - name: 'max_drawdown'
      type: 'minimize'
      scale: 1.0
  pareto_front_size: 20
  crowding_distance_percentile: 0.1
  min_trades: 60

generic_island_model:
  enabled: false

# ── Fitness Weights (used for reporting / scalar fallback only) ────────────
fitness_weights:
  profit: 0.28
  sharpe_ratio: 0.15
  sortino_ratio: 0.08
  profit_factor: 0.08
  drawdown: 0.13
  win_rate: 0.14
  trade_frequency: 0.10
  monthly_stability: 0.02
  cross_pair: 0.02

fitness_bounds:
  profit_min: -15.0
  profit_max: 50.0

trade_frequency_thresholds:
  auto_scale_by_timeframe: true
  shape: 'gaussian'

fitness_penalties:
  min_trades: 60
  min_trades_per_month: 10
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.20
  min_win_rate: 0.35
  complexity_weight: 0.01

backtesting:
  timerange: "20210101-20260331"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "SOL/USDT"
    - "ETH/USDT"
    - "BNB/USDT"
  max_open_trades: 3
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 300

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "SOL/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "BNB/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0
  validate_top_n_only: 10

walk_forward:
  enabled: false

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 60
  max_drawdown: 0.20
  min_win_rate: 0.35
  timeframes: ["15m"]
  stoploss_range: [-0.040, -0.010]
  roi_range: [0.005, 0.025]
  max_open_trades_range: [1, 4]
  trailing_stop_positive_range: [0.005, 0.020]
  trailing_stop_offset_addition_range: [0.003, 0.012]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'ROC'
    - 'TEMA'
    - 'KAMA'
    - 'VWAP'
    - 'STOCH'
    - 'DONCHIAN'
    - 'WILLR'
    - 'AROON'
  min_per_strategy: 2
  max_per_strategy: 4

storage:
  database: "genetic_algorithm/data/wave31_C.db"
  strategy_dir: "user_data/strategies/wave31_C"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave31_C"
  checkpoint_interval: 3
  keep_history: true
  min_disk_gb: 5.0
  min_disk_gb_runtime: 2.0
  max_cache_disk_mb: 8000

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave31_C.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: true
  update_interval: 1
  output_dir: "genetic_algorithm/output/exploration/wave31/C_plain_15m_nsga2_3obj/plots"

terminal_monitor:
  enabled: true
  default_mode: "simple"

hall_of_fame:
  enabled: true
  max_size: 50
  inject_count: 3
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_wave31_C"

deflated_sharpe:
  enabled: true
