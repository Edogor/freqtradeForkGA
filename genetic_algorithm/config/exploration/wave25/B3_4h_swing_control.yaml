# ============================================================================
# WAVE25 — B3: 4h Swing Control
# ============================================================================
# Island model control run — validates that our improvements don't regress
# on longer timeframes. Compares directly with wave23 P4 (4h, Sharpe 3.17).
# 5 islands × 8 pop = 40 individuals, 40 generations
# Walk-forward swing preset (120d/30d/15d)
# Expected runtime: ~10-14 hours
# ============================================================================

experiment_name: wave25_B3_4h_swing_control

genetic_algorithm:
  random_seed: null
  population_size: 8
  generations: 40
  mutation_rate: 0.18
  crossover_rate: 0.7
  elite_size: 2
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 15
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.1
  mutation_cooldown_factor: 0.5
  fitness_sharing: false
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'single_objective'

surrogate:
  enabled: true
  min_training_samples: 50
  filter_percentile: 60
  retrain_interval: 3
  model: "random_forest"
  mutate_skipped: true

generic_island_model:
  enabled: true
  num_islands: 5
  population_per_island: 8
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false

fitness_weights:
  profit: 0.20
  sharpe_ratio: 0.18
  sortino_ratio: 0.12
  profit_factor: 0.10
  drawdown: 0.15
  win_rate: 0.05
  trade_frequency: 0.12
  consistency: 0.04
  exposure_time: 0.04

trade_frequency_thresholds:
  auto_scale_by_timeframe: true
  shape: 'asymmetric'

fitness_penalties:
  min_trades: 20
  min_trades_per_month: 4
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.25
  min_win_rate: 0.30
  complexity_weight: 0.01

backtesting:
  timerange: "20210301-20260324"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "ETH/USDT"
    - "XRP/USDT"
    - "PEPE/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 180

walk_forward:
  enabled: false
  preset: swing
  mode: 'rolling'
  aggregation: 'harmonic_mean'
  embargo_days: 5
  min_train_trades: 5
  max_windows: 8
  gap_penalty:
    enabled: true
    threshold: 0.1
    max_penalty: 0.5

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "XRP/USDT"
    - "PEPE/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0
  validate_top_n_only: 5

holdout_validation:
  enabled: false
  holdout_pct: 0.15

holdout_monitoring:
  enabled: false
  interval: 3
  top_n: 3
  early_stop: true
  early_stop_threshold: 0.60
  early_stop_checks: 3
  fitness_penalty: true
  penalty_factor: 0.8

monte_carlo:
  enabled: false
  num_permutations: 15
  methods:
    - bootstrap
    - shuffle
    - slippage_jitter
  slippage_std: 0.0005

strategy_constraints:
  min_trades: 20
  max_drawdown: 0.25
  min_win_rate: 0.30
  timeframes: ["4h"]
  stoploss_range: [-0.12, -0.04]
  roi_range: [0.02, 0.10]
  max_open_trades_range: [1, 5]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'DONCHIAN'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'WILLR'
    - 'ROC'
    - 'AROON'
    - 'TEMA'
    - 'KAMA'
  min_per_strategy: 2
  max_per_strategy: 5

storage:
  database: "genetic_algorithm/data/wave25_B3.db"
  strategy_dir: "user_data/strategies/wave25_B3"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave25_B3"
  checkpoint_interval: 3
  keep_history: true
  min_disk_gb: 5.0
  min_disk_gb_runtime: 2.0
  max_cache_disk_mb: 5000

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave25_B3.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: true
  update_interval: 1
  output_dir: "genetic_algorithm/output/exploration/wave25/B3_4h_swing_control/plots"

terminal_monitor:
  enabled: true
  default_mode: "simple"

hall_of_fame:
  enabled: true
  max_size: 50
  inject_count: 2
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_wave25_B3"

deflated_sharpe:
  enabled: true
  min_trades: 5
  benchmark_sr: 0.0
  skewness_correction: true

advanced:
  parallel_evaluation: true
  max_workers: 5
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: false

island_model:
  enabled: false
