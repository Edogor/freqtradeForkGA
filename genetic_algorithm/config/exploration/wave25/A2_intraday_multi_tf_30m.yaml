# ============================================================================
# WAVE25 — A2: Intraday Multi-TF (30m base + 1h/4h informative)
# ============================================================================
# Based on P2 (wave23: 89.6% win rate, Sharpe 3.52)
# Island model + Ring topology + Surrogate + Pair-split + Multi-TF
# 5 islands × 12 pop = 60 individuals, 40 generations
# Adds: multi-timeframe, walk-forward intraday preset, disk protection
# Train: BTC, SOL, BNB | Validate: ETH, XRP, PEPE
# Expected runtime: ~18-24 hours
# ============================================================================

experiment_name: wave25_A2_intraday_multi_tf_30m

genetic_algorithm:
  random_seed: null
  population_size: 12
  generations: 40
  mutation_rate: 0.20
  crossover_rate: 0.7
  elite_size: 2
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 12
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.12
  mutation_cooldown_factor: 0.5
  fitness_sharing: true
  sharing_radius: 0.20
  diversity_threshold: 0.12
  allow_self_crossover: false
  random_immigrants: 2
  mode: 'single_objective'

surrogate:
  enabled: true
  min_training_samples: 50
  filter_percentile: 60
  retrain_interval: 3
  model: "random_forest"
  mutate_skipped: true

generic_island_model:
  enabled: true
  num_islands: 5
  population_per_island: 12
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false

fitness_weights:
  profit: 0.18
  sharpe_ratio: 0.16
  sortino_ratio: 0.11
  profit_factor: 0.08
  drawdown: 0.14
  win_rate: 0.07
  trade_frequency: 0.18
  consistency: 0.04
  exposure_time: 0.04

trade_frequency_thresholds:
  auto_scale_by_timeframe: true
  shape: 'asymmetric'

fitness_penalties:
  min_trades: 60
  min_trades_per_month: 10
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.22
  min_win_rate: 0.32
  complexity_weight: 0.012

backtesting:
  timerange: "20210301-20260324"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "ETH/USDT"
    - "XRP/USDT"
    - "PEPE/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 180

walk_forward:
  enabled: false
  preset: intraday
  mode: 'rolling'
  aggregation: 'harmonic_mean'
  embargo_days: 3
  min_train_trades: 6
  max_windows: 10
  gap_penalty:
    enabled: true
    threshold: 0.1
    max_penalty: 0.5

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "XRP/USDT"
    - "PEPE/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0
  validate_top_n_only: 5

holdout_validation:
  enabled: false
  holdout_pct: 0.15

holdout_monitoring:
  enabled: false
  interval: 3
  top_n: 3
  early_stop: true
  early_stop_threshold: 0.60
  early_stop_checks: 3
  fitness_penalty: true
  penalty_factor: 0.8

monte_carlo:
  enabled: false
  num_permutations: 15
  methods:
    - bootstrap
    - shuffle
    - slippage_jitter
  slippage_std: 0.0005

strategy_constraints:
  min_trades: 60
  max_drawdown: 0.22
  min_win_rate: 0.32
  timeframes: ["30m"]
  stoploss_range: [-0.08, -0.02]
  roi_range: [0.005, 0.04]
  max_open_trades_range: [1, 5]

multi_timeframe:
  enabled: true
  available: ['1h', '4h']
  max_timeframes: 2
  higher_timeframe_preference:
    - 'EMA'
    - 'SMA'
    - 'BBANDS'
    - 'ATR'
    - 'ADX'
    - 'RSI'
    - 'SUPERTREND'

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'DONCHIAN'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'WILLR'
    - 'ROC'
    - 'AROON'
    - 'TEMA'
    - 'KAMA'
  min_per_strategy: 2
  max_per_strategy: 5

storage:
  database: "genetic_algorithm/data/wave25_A2.db"
  strategy_dir: "user_data/strategies/wave25_A2"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave25_A2"
  checkpoint_interval: 3
  keep_history: true
  min_disk_gb: 5.0
  min_disk_gb_runtime: 2.0
  max_cache_disk_mb: 5000

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave25_A2.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: true
  update_interval: 1
  output_dir: "genetic_algorithm/output/exploration/wave25/A2_intraday_multi_tf_30m/plots"

terminal_monitor:
  enabled: true
  default_mode: "simple"

hall_of_fame:
  enabled: true
  max_size: 50
  inject_count: 2
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_wave25_A2"

deflated_sharpe:
  enabled: true
  min_trades: 8
  benchmark_sr: 0.0
  skewness_correction: true

advanced:
  parallel_evaluation: true
  max_workers: 5
  enable_dry_run: false
  enable_ml_fitness: false

  llm:
    enabled: true
    provider: "groq"
    api_key: ""
    model: "llama-3.3-70b-versatile"
    temperature: 0.7
    max_retries: 3
    timeout: 60
    seed_ratio: 0.20
    immigrants_per_generation: 2
    immigrant_ratio: 0.50
    batch_enabled: true
    max_batch_size: 5
    max_calls_per_generation: 15
    max_calls_per_run: 400

island_model:
  enabled: false
