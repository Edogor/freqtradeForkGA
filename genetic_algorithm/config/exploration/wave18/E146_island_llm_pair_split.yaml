# ============================================================================
# WAVE 18 — E146: Island + LLM + Pair-Split (Combined)
# ============================================================================
# Purpose: Combine LLM-guided evolution with pair-split validation.
#          C3/C4 showed LLM islands produce high fitness but UNKNOWN overfit
#          status. Adding pair-split gives actual generalization measurement.
#
# 10 islands × 6 pop × 12 gens = 720 evals + LLM overhead
# Pair split: Train on BTC/BNB/XRP, validate on ETH/SOL
# Expected runtime: ~3-5 hours (LLM API calls add ~30% overhead)
# ============================================================================

genetic_algorithm:
  random_seed: null
  population_size: 6
  generations: 12
  mutation_rate: 0.18
  crossover_rate: 0.7
  elite_size: 1
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.1
  fitness_sharing: false
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'single_objective'

generic_island_model:
  enabled: true
  num_islands: 10
  population_per_island: 6
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.5
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 1
    merge_rounds: false

fitness_weights:
  profit: 0.25
  sharpe_ratio: 0.20
  sortino_ratio: 0.15
  profit_factor: 0.10
  drawdown: 0.15
  win_rate: 0.08
  trade_frequency: 0.07

fitness_penalties:
  min_trades: 5
  max_drawdown: 0.25
  min_win_rate: 0.30
  complexity_weight: 0.01

backtesting:
  timerange: "20210301-20260301"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 180

walk_forward:
  enabled: false

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "SOL/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 5
  max_drawdown: 0.25
  min_win_rate: 0.30
  timeframes: ["15m"]
  stoploss_range: [-0.15, -0.05]
  roi_range: [0.01, 0.08]
  max_open_trades_range: [1, 5]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'DONCHIAN'
    - 'CMF'
    - 'VROC'
  min_per_strategy: 2
  max_per_strategy: 5

island_model:
  enabled: false

# === LLM Integration ===
advanced:
  parallel_evaluation: false
  max_workers: 1
  enable_llm: true
  llm:
    enabled: true
    temperature: 0.7
    max_retries: 3
    timeout: 60
    min_call_interval: 3.0
    retry_delay: 5.0
    seed_ratio: 0.4
    immigrant_ratio: 0.5
    providers_list:
      - provider: anthropic
        model: claude-3-haiku-20240307
        api_key: ""
      - provider: groq
        model: llama-3.1-8b-instant
        api_key: ""

terminal_monitor:
  enabled: true
