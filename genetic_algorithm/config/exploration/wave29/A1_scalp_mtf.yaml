# ============================================================================
# WAVE29 — A1: Multi-Timeframe Scalp (Full Overhaul)
# ============================================================================
# 15 islands × 15 pop = 225 individuals, fully_connected + merge rounds
# Pop 15 + 2 pairs: follows anti-pattern validation (E19/E30/E32)
# Restricted to 5m/15m/30m base TFs — no 1h+ base timeframes
# TF-adaptive indicator parameters, volume gate, trade duration penalty,
# dynamic slippage, trade clustering penalty, spread-aware fitness
# Walk-forward validation enabled (scalping preset)
# Pair validation: 3 train / 3 validation
# 5+ year timerange (2021-2026) for regime diversity
# 4 parallel workers on 6-core i5-9500T (~67% CPU)
# ============================================================================

experiment_name: wave29_A1_scalp_mtf

genetic_algorithm:
  random_seed: null
  population_size: 15
  generations: 40
  mutation_rate: 0.20
  crossover_rate: 0.7
  elite_size: 3
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 20
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.12
  mutation_cooldown_factor: 0.5
  fitness_sharing: true
  sharing_radius: 0.30
  diversity_threshold: 0.12
  allow_self_crossover: false
  random_immigrants: 2
  mode: 'single_objective'

surrogate:
  enabled: true
  min_training_samples: 80
  filter_percentile: 70
  retrain_interval: 3
  model: "gradient_boosting"
  mutate_skipped: true

generic_island_model:
  enabled: true
  num_islands: 15
  population_per_island: 15
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.4
    pair_rotation: false
  migration:
    topology: 'fully_connected'
    interval: 5
    count: 1
    merge_rounds: true
    merge_interval: 10

# ── Fitness Weights (pure scalping emphasis) ──────────────────────────────
# trade_frequency is king: scalping = volume of opportunities
# win_rate critical: many small wins, can't afford low hit rate
# drawdown boosted: tight risk tolerance for short-term strategies
# profit de-emphasized: we gather many small wins, not big swings
# sharpe lowered slightly: trade frequency matters more than risk-adj returns
fitness_weights:
  profit: 0.06
  sharpe_ratio: 0.12
  sortino_ratio: 0.10
  profit_factor: 0.07
  drawdown: 0.15
  win_rate: 0.18
  trade_frequency: 0.24
  consistency: 0.04
  exposure_time: 0.04

trade_frequency_thresholds:
  auto_scale_by_timeframe: true
  shape: 'gaussian'

# ── Penalties (tight for quality scalping) ────────────────────────────────
fitness_penalties:
  min_trades: 150
  min_trades_per_month: 25
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.12
  min_win_rate: 0.45
  complexity_weight: 0.01
  # Trade duration penalty: penalize strategies that hold too long
  max_avg_trade_candles: 12
  trade_duration_penalty_weight: 0.3
  # Trade clustering penalty: penalize spam entries
  trade_clustering_enabled: true
  trade_clustering_max_per_window: 3
  trade_clustering_window_candles: 5
  # Spread-aware penalty: penalize strategies whose edge is too thin
  spread_aware_enabled: true
  spread_aware_min_edge_multiplier: 2.0

backtesting:
  timerange: "20210101-20260331"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
  max_open_trades: 3
  fee: 0.001
  slippage_pct: 0.001
  dynamic_slippage: true
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 300

parallel_evaluation:
  enabled: true
  num_workers: 2
  backtest_timeout: 300

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
  validation_pairs:
    - "ETH/USDT"
  weight_train: 0.6
  weight_val: 0.4
  min_val_fitness: 0.0
  validate_top_n_only: 8

walk_forward:
  enabled: false
  preset: scalping

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

# ── Strategy Constraints (true scalping ranges) ──────────────────────────
# Base TFs: 5m/15m/30m only — no 1h+ (those are swing, not scalping)
# Informative TFs: 1h/4h allowed as READ-ONLY context
# Stoploss: 0.5-2.5% (was 0.8-3.5% in wave28, population drifted to 9%)
# ROI: 0.2-1.2% (was 0.3-1.8%, tighter for realistic scalp targets)
# Trailing: 0.2-0.8% lock-in (was 0.3-1.2%)
strategy_constraints:
  min_trades: 150
  max_drawdown: 0.12
  min_win_rate: 0.45
  timeframes: ["5m", "15m", "30m"]
  informative_timeframes: ["1h", "4h"]
  stoploss_range: [-0.025, -0.005]
  roi_range: [0.002, 0.012]
  max_open_trades_range: [1, 4]
  trailing_stop_positive_range: [0.002, 0.008]
  trailing_stop_offset_addition_range: [0.002, 0.006]
  # Volume gate: require above-average volume for entries
  volume_gate: true
  volume_gate_sma_period: 20
  volume_gate_threshold: 0.5

# ── 18 Indicators (same pool, TF-adaptive parameters) ────────────────────
indicators:
  # Scale indicator period ranges based on strategy timeframe
  # 5m gets faster indicators (~0.29x), 15m (~0.5x), 30m (~0.71x), 1h (1.0x)
  timeframe_adaptive_indicators: true
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'ROC'
    - 'TEMA'
    - 'KAMA'
    - 'VWAP'
    - 'STOCH'
    - 'DONCHIAN'
    - 'WILLR'
    - 'AROON'
  min_per_strategy: 2
  max_per_strategy: 4

storage:
  database: "genetic_algorithm/data/wave29_A1.db"
  strategy_dir: "user_data/strategies/wave29_A1"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave29_A1"
  checkpoint_interval: 3
  keep_history: true
  min_disk_gb: 5.0
  min_disk_gb_runtime: 2.0
  max_cache_disk_mb: 8000

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave29_A1.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: true
  update_interval: 1
  output_dir: "genetic_algorithm/output/exploration/wave29/A1_scalp_mtf/plots"

terminal_monitor:
  enabled: true
  default_mode: "simple"

hall_of_fame:
  enabled: true
  directory: "genetic_algorithm/data/hall_of_fame_wave29_A1"

# ── Regime detection ──────────────────────────────────────────────────────
regime:
  enabled: true
  regime_timeframes: ["1h"]
  micro_regime: true   # Fast ADX/DI on base TF (7-period) for scalping responsiveness
  timeframe_weights:
    micro: 2.0     # Base-TF micro-regime gets highest weight
    1h: 1.0        # 1h informative for broader context
  entry_trend_min: -0.3
  entry_trend_max: 1.0
  exit_on_regime_change: false
  combination: "weighted_voting"
