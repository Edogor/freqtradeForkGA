# ============================================================================
# SIS ROUND 3 VALIDATION — Y1: CONTROL (no SIS) — 3×8 ring, 20 gens
# ============================================================================
# Fresh ctrl baseline with seed 303, doubled generation count vs X-series
# Paired with: Y3_sis_r3_4h_3x8.yaml (same seed 303)
# Compare to: X1 ctrl (seed 303, 10-gen, best=0.3707)
# ============================================================================

experiment_name: sis_r3_Y1_ctrl_s303

genetic_algorithm:
  random_seed: 303
  population_size: 8
  generations: 20
  mutation_rate: 0.18
  crossover_rate: 0.70
  elite_size: 3
  tournament_size: 3
  selection_method: 'rank'
  convergence_patience: 12
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.12
  mutation_cooldown_factor: 0.5
  fitness_sharing: false
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'single_objective'

surrogate:
  enabled: false

generic_island_model:
  enabled: true
  num_islands: 3
  population_per_island: 8
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.40
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false

fitness_weights:
  profit: 0.42
  profit_factor: 0.22
  drawdown: 0.18
  sharpe_ratio: 0.13
  monthly_stability: 0.05

fitness_bounds:
  profit_min: -30.0
  profit_max: 100.0

trade_frequency_thresholds:
  auto_scale_by_timeframe: true
  shape: 'gaussian'

fitness_penalties:
  min_trades: 8
  min_trades_per_month: 2
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.30
  min_win_rate: 0.30
  complexity_weight: 0.01

backtesting:
  timerange: "20210101-20260331"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "XRP/USDT"
  max_open_trades: 2
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 120

pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "XRP/USDT"
  weight_train: 0.60
  weight_val: 0.40
  min_val_fitness: 0.0
  validate_top_n_only: 5

walk_forward:
  enabled: false
holdout_validation:
  enabled: false
holdout_monitoring:
  enabled: false
monte_carlo:
  enabled: false

strategy_constraints:
  min_trades: 8
  max_drawdown: 0.30
  min_win_rate: 0.30
  timeframes: ["4h"]
  stoploss_range: [-0.200, -0.050]
  roi_range: [0.020, 0.150]
  max_open_trades_range: [1, 3]
  trailing_stop_positive_range: [0.010, 0.050]
  trailing_stop_offset_addition_range: [0.005, 0.025]

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'ADX'
    - 'CCI'
    - 'ATR'
    - 'STOCH'
    - 'DONCHIAN'
    - 'WILLR'
    - 'ROC'
    - 'AROON'
  min_per_strategy: 2
  max_per_strategy: 4

storage:
  database: "genetic_algorithm/data/sis_r3/Y1_ctrl_s303.db"
  strategy_dir: "user_data/strategies/sis_r3/Y1_ctrl_s303"
  checkpoint_dir: "genetic_algorithm/data/sis_r3/Y1_ctrl_checkpoints"
  checkpoint_interval: 5
  keep_history: true
  min_disk_gb: 2.0
  min_disk_gb_runtime: 1.0
  max_cache_disk_mb: 3000

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/sis_r3/Y1_ctrl_s303.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: false

terminal_monitor:
  enabled: true
  default_mode: "simple"

hall_of_fame:
  enabled: true
  max_size: 20
  inject_count: 2
  min_fitness: 0.10
  directory: "genetic_algorithm/data/sis_r3/Y1_ctrl_s303_hof"

deflated_sharpe:
  enabled: true
