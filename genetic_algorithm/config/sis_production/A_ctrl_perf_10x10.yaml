# ============================================================================
# SIS PRODUCTION — A: CONTROL — Performance Variant (10×10 Ring)
# ============================================================================
# Baseline control for SIS A/B test. No SIS enabled.
# Paired with: C_sis_perf_10x10.yaml (identical config + SIS hooks)
#
# Design rationale (ga-params-configs-2026-03-19 findings):
#   - Fitness: profit 42%, profit_factor 22%, drawdown 18%, sharpe 13%
#   - trade_frequency=0, win_rate=0 (removed — wave26 root cause)
#   - ROI [0.8%-6%], SL [-7% to -1.5%] (mathematically winnable)
#   - 10 islands × 10 pop = 100 total (best fitness topology from E138)
#   - Ring topology, rank selection, 15m timeframe
#   - Pair validation only (skip WF/holdout/MC per exploration policy)
#   - random_seed: 42 for reproducibility vs SIS variant
#
# Target runtime: ~60-90 min (sequential islands)
# Train: BTC+SOL | Validate: ETH+BNB
# ============================================================================

experiment_name: sis_prod_A_ctrl_perf_10x10

genetic_algorithm:
  random_seed: 42
  population_size: 10
  generations: 20
  mutation_rate: 0.18
  crossover_rate: 0.70
  elite_size: 3
  tournament_size: 3
  selection_method: 'rank'
  convergence_patience: 12
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.12
  mutation_cooldown_factor: 0.5
  fitness_sharing: true
  sharing_radius: 0.22
  diversity_threshold: 0.12
  allow_self_crossover: false
  random_immigrants: 2
  mode: 'single_objective'

surrogate:
  enabled: true
  min_training_samples: 60
  filter_percentile: 70
  retrain_interval: 3
  model: "gradient_boosting"
  mutate_skipped: true

# === ISLAND MODEL (10 islands × 10 pop, ring topology) ===
generic_island_model:
  enabled: true
  num_islands: 10
  population_per_island: 10
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.40
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: false

# === FITNESS (ga-params-configs findings applied) ===
# profit 42% + profit_factor 22% + drawdown 18% + sharpe 13% + stability 5%
# trade_frequency = 0 (REMOVED — wave26 root cause of overtrading)
# win_rate = 0 (REMOVED — misleading: high WR + tiny ROI vs large SL = net loss)
fitness_weights:
  profit: 0.42
  profit_factor: 0.22
  drawdown: 0.18
  sharpe_ratio: 0.13
  monthly_stability: 0.05

fitness_bounds:
  profit_min: -15.0
  profit_max: 50.0

trade_frequency_thresholds:
  auto_scale_by_timeframe: true
  shape: 'gaussian'

fitness_penalties:
  min_trades: 60
  min_trades_per_month: 10
  min_trades_per_month_penalty: 0.05
  max_drawdown: 0.20
  min_win_rate: 0.35
  complexity_weight: 0.01

# === BACKTESTING ===
backtesting:
  timerange: "20210101-20260331"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "SOL/USDT"
    - "ETH/USDT"
    - "BNB/USDT"
  max_open_trades: 3
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 300

# === PAIR VALIDATION (anti-overfitting: 2 train + 2 val) ===
pair_validation:
  enabled: true
  training_pairs:
    - "BTC/USDT"
    - "SOL/USDT"
  validation_pairs:
    - "ETH/USDT"
    - "BNB/USDT"
  weight_train: 0.60
  weight_val: 0.40
  min_val_fitness: 0.0
  validate_top_n_only: 8

walk_forward:
  enabled: false

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

monte_carlo:
  enabled: false

# === STRATEGY CONSTRAINTS (corrected ROI/SL ranges) ===
# roi_min/stoploss_max ratio must be achievable at realistic win rates
# 0.8% ROI min with -7% SL max — GA evolves within range, pair validation filters losers
strategy_constraints:
  min_trades: 60
  max_drawdown: 0.20
  min_win_rate: 0.35
  timeframes: ["15m"]
  stoploss_range: [-0.070, -0.015]
  roi_range: [0.008, 0.060]
  max_open_trades_range: [1, 4]
  trailing_stop_positive_range: [0.005, 0.020]
  trailing_stop_offset_addition_range: [0.003, 0.012]

# === INDICATORS ===
indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'SUPERTREND'
    - 'PSAR'
    - 'CMF'
    - 'VROC'
    - 'MFI'
    - 'ROC'
    - 'TEMA'
    - 'KAMA'
    - 'VWAP'
    - 'STOCH'
    - 'DONCHIAN'
    - 'WILLR'
    - 'AROON'
    - 'CCI'
    - 'ATR'
    - 'ADX'
  min_per_strategy: 2
  max_per_strategy: 4

# === STORAGE ===
storage:
  database: "genetic_algorithm/data/sis_production/A_ctrl_perf.db"
  strategy_dir: "user_data/strategies/sis_production/A_ctrl_perf"
  checkpoint_dir: "genetic_algorithm/data/sis_production/A_ctrl_perf_checkpoints"
  checkpoint_interval: 3
  keep_history: true
  min_disk_gb: 5.0
  min_disk_gb_runtime: 2.0
  max_cache_disk_mb: 8000

# === LOGGING ===
logging:
  level: "INFO"
  file: "genetic_algorithm/logs/sis_production/A_ctrl_perf_10x10.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: true
  update_interval: 1
  output_dir: "genetic_algorithm/output/sis_production/A_ctrl_perf/plots"

terminal_monitor:
  enabled: true
  default_mode: "simple"

hall_of_fame:
  enabled: true
  max_size: 50
  inject_count: 3
  min_fitness: 0.10
  directory: "genetic_algorithm/data/sis_production/A_ctrl_perf_hof"

deflated_sharpe:
  enabled: true
  min_trades: 10
  benchmark_sr: 0.0
  skewness_correction: true

advanced:
  parallel_evaluation: true
  max_workers: 6
  enable_dry_run: false
  enable_ml_fitness: false

  llm:
    enabled: false

island_model:
  enabled: false

sis:
  enabled: false
